<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>家計簿</title>
  <link rel="apple-touch-icon" href="img/kakeibo.png">
  <link rel="icon" type="image/png" href="img/kakeibo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計簿">
  <meta name="theme-color" content="#fff3c4">
  <style>
    :root{
      --bg:#fff8e7;--card:#fff;--main:#ffb84d;--safe:#2e9f62;--danger:#e63946;
      --text:#333;--muted:#777;--line:#eadfc9;
      --shadow:0 8px 20px rgba(130,90,30,.12);--radius:18px
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#fff2bf 0%,var(--bg) 220px);
      color:var(--text);line-height:1.6;padding-bottom:100px}
    header{padding:20px 16px 8px;text-align:center}
    header h1{margin:0;font-size:1.6rem;letter-spacing:.04em}
    header p{margin:4px 0 0;color:#6b4b1f;font-size:.88rem}
    .app{width:min(680px,100%);margin:0 auto;padding:10px 14px}

    /* カード共通 */
    .card{background:rgba(255,255,255,.94);border:1px solid rgba(234,223,201,.9);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
    .card h2{margin:0 0 12px;font-size:1.05rem;font-weight:800}
    .collapse-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
      cursor:pointer;user-select:none;-webkit-user-select:none}
    .card h2.collapse-head{margin-bottom:12px}
    .collapsible-card.collapsed .collapse-head{margin-bottom:0}
    .collapse-icon{font-size:.78rem;color:var(--muted);font-weight:900;flex:0 0 auto}
    .collapse-content[hidden]{display:none}

    /* ── クラウド設定（常に最上部・アコーディオン） ── */
    .sync-box{background:linear-gradient(135deg,#eef8ff,#fff);border:2px solid #bfe4ff}
    .sync-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
      cursor:pointer;user-select:none;-webkit-user-select:none}
    .sync-head h2{margin:0;font-size:1rem;font-weight:800;pointer-events:none}
    .sync-head-right{display:flex;align-items:center;gap:8px;pointer-events:none}
    .sync-badge{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .sync-badge.ok{background:#d4f5e3;color:#247344}
    .sync-badge.ng{background:#ffe8e8;color:#a4161a}
    .sync-badge.idle{background:#f0f0f0;color:#888}
    .sync-toggle-icon{font-size:.82rem;color:var(--muted);font-weight:700;white-space:nowrap}
    .sync-body{margin-top:14px}
    label.form-label{display:block;font-size:.85rem;font-weight:700;margin-bottom:5px}
    input.text-input,input.pass-input{width:100%;border:1px solid #dfd1ba;border-radius:10px;
      padding:10px 12px;font-size:.95rem;background:#fffdf8;color:var(--text);margin-bottom:10px}
    .inline-check{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;margin:4px 0 10px}
    .inline-check input{width:auto}
    .sync-status{margin-top:8px;padding:9px 10px;border-radius:10px;background:#fffdf8;
      border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
    .sync-status.ok{background:#f0fff7;border-color:#c6ead6;color:#247344;font-weight:700}
    .sync-status.ng{background:#fff1f2;border-color:#f4a7af;color:#a4161a;font-weight:700}
    .hint{color:var(--muted);font-size:.8rem;margin:8px 0 0}
    .btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

    /* 月ナビ */
    .month-nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
    .month-nav strong{min-width:130px;text-align:center;font-size:1.1rem;font-weight:800}
    .nav-btn{border:none;border-radius:999px;padding:9px 16px;font-size:.92rem;font-weight:700;
      cursor:pointer;background:#fff3d1;color:#5b3a05;border:1px solid #ebd19a}

    /* 表示切替 */
    .view-switch{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
    .view-switch label{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;
      border-radius:999px;background:#fffdf8;border:1px solid var(--line);font-size:.88rem;cursor:pointer}
    .view-switch input{width:auto}

    /* 合計サマリ */
    .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .summary-box{background:#fff9ed;border:1px solid var(--line);border-radius:14px;
      padding:12px;text-align:center}
    .summary-label{color:var(--muted);font-size:.8rem}
    .summary-value{margin-top:4px;font-size:1.2rem;font-weight:800}
    .income-note{margin-top:10px;font-size:.82rem;color:var(--muted)}

    /* 支払い元別 */
    .payment-list{display:grid;gap:8px}
    .payment-row{display:flex;justify-content:space-between;align-items:center;
      padding:10px 14px;background:#fff9ed;border:1px solid var(--line);border-radius:12px;
      cursor:pointer;transition:background .12s}
    .payment-row:hover,.payment-row:active{background:#fff0d0}
    .payment-row.no-click{cursor:default}
    .payment-row.no-click:hover,.payment-row.no-click:active{background:#f5f2ea}
    .payment-name{font-size:.9rem;font-weight:700}
    .payment-name-wrap{display:flex;align-items:center;gap:6px}
    .payment-chevron{font-size:.75rem;color:var(--muted)}
    .payment-amount{font-size:1.05rem;font-weight:800}
    .payment-row.pink{background:linear-gradient(135deg,#ffe3ef,#fff7fb);border-color:#ffc3dc}
    .payment-row.pink:hover,.payment-row.pink:active{background:#ffd8ea}
    .payment-row.pink .payment-name{color:#a6164b}
    .rakuten-total{display:flex;justify-content:space-between;align-items:center;
      padding:13px 14px;margin-bottom:2px;border:2px solid #f3a7c5;border-radius:14px;
      background:linear-gradient(135deg,#ffd8e8,#fff2f7);color:#8f1747}
    .rakuten-total-label{font-size:.95rem;font-weight:800}
    .rakuten-total-amount{font-size:1.25rem;font-weight:900}

    /* 履歴ドロワー */
    .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200}
    .drawer-overlay.open{display:block}
    .drawer{position:fixed;bottom:0;left:0;right:0;z-index:201;
      background:#fff;border-radius:24px 24px 0 0;
      max-height:80svh;display:flex;flex-direction:column;
      box-shadow:0 -8px 40px rgba(0,0,0,.18);
      transform:translateY(100%);transition:transform .25s ease}
    .drawer.open{transform:translateY(0)}
    .drawer-handle{width:40px;height:4px;background:#ddd;border-radius:999px;margin:12px auto 0}
    .drawer-head{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex-shrink:0}
    .drawer-title{font-size:1.05rem;font-weight:800}
    .drawer-close{border:none;background:#f0f0f0;border-radius:999px;width:32px;height:32px;
      font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
    .drawer-filter{padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);flex-shrink:0}
    .filter-btn{border:1px solid var(--line);border-radius:999px;padding:5px 12px;
      font-size:.8rem;font-weight:700;cursor:pointer;background:#fffdf8;color:var(--text)}
    .filter-btn.active{background:var(--main);border-color:#e0980a;color:#3e2600}
    .drawer-body{overflow-y:auto;padding:10px 14px 32px;flex:1}
    .drawer-empty{text-align:center;color:var(--muted);padding:32px 0;font-size:.9rem}
    .drawer-total{font-size:.85rem;color:var(--muted);padding:0 2px 8px;font-weight:700}
    .history-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;
      padding:10px 4px;border-bottom:1px solid var(--line);font-size:.88rem}
    .history-item:last-child{border-bottom:none}
    .history-date{color:var(--muted);font-size:.8rem;white-space:nowrap}
    .history-detail{min-width:0}
    .history-memo{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .history-sub{font-size:.76rem;color:var(--muted);margin-top:1px}
    .history-amount{font-weight:800;white-space:nowrap;text-align:right}
    .history-amount.income{color:var(--safe)}

    /* 履歴アイテム：編集ボタン付きレイアウト */
    .history-item{padding:10px 4px;border-bottom:1px solid var(--line);font-size:.88rem}
    .history-item:last-child{border-bottom:none}
    .history-item-top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
    .history-edit-btn{margin-top:6px;border:1px solid var(--line);border-radius:999px;
      padding:4px 12px;font-size:.78rem;font-weight:700;cursor:pointer;
      background:#fff9ed;color:#5b3a05;box-shadow:none;display:inline-flex;gap:4px}
    .history-edit-btn:active{background:#ffe8a0}

    /* 編集モーダル */
    .edit-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
      align-items:flex-end;justify-content:center}
    .edit-overlay.open{display:flex}
    .edit-modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:560px;
      max-height:88svh;overflow-y:auto;padding:0 0 40px;
      box-shadow:0 -8px 40px rgba(0,0,0,.22)}
    .edit-handle{width:40px;height:4px;background:#ddd;border-radius:999px;margin:12px auto 8px}
    .edit-head{padding:10px 18px 14px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between}
    .edit-head h3{margin:0;font-size:1rem;font-weight:800}
    .edit-close-btn{border:none;background:#f0f0f0;border-radius:999px;width:32px;height:32px;
      font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:none}
    .edit-body{padding:16px 18px;display:grid;gap:14px}
    .edit-field label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:5px}
    .edit-field input,.edit-field select,.edit-field textarea{
      width:100%;border:1px solid var(--line);border-radius:10px;
      padding:10px 12px;font-size:1rem;background:#fffdf8;color:var(--text);font-family:inherit}
    .edit-field textarea{min-height:54px;resize:vertical}
    .edit-field input:focus,.edit-field select:focus,.edit-field textarea:focus{
      outline:none;border-color:var(--main)}
    /* 支払い元クイック選択 */
    .edit-pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
    .edit-pay-btn{border:2px solid var(--line);border-radius:12px;padding:10px 8px;
      font-size:.88rem;font-weight:800;cursor:pointer;background:#fffdf8;color:var(--text);
      text-align:center;box-shadow:none;transition:all .12s}
    .edit-pay-btn.sel{border-color:var(--main);background:linear-gradient(135deg,#fff3cc,#ffe8a0);color:#3e2600}
    .edit-pay-btn.sel-pink{border-color:#ff7baa;background:linear-gradient(135deg,#ffe3ef,#ffd0e3);color:#a6164b}
    /* 収入/支出 切り替え */
    .edit-type-row{display:flex;gap:8px}
    .edit-type-btn{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px;
      font-size:.9rem;font-weight:800;cursor:pointer;background:#fffdf8;color:var(--muted);
      text-align:center;box-shadow:none;transition:all .12s}
    .edit-type-btn.sel-expense{border-color:#ff8c00;background:linear-gradient(135deg,#ffb84d,#ff8c00);color:#3e2600}
    .edit-type-btn.sel-income{border-color:#2e9f62;background:linear-gradient(135deg,#4ecb7f,#2e9f62);color:#fff}
    /* フッターボタン */
    .edit-footer{padding:0 18px;display:flex;gap:10px}
    .edit-save-btn{flex:1;border:none;border-radius:999px;padding:14px;font-size:1rem;font-weight:900;
      cursor:pointer;background:linear-gradient(135deg,#ffb84d,#ff8c00);color:#3e2600;
      box-shadow:0 4px 12px rgba(180,100,0,.22)}
    .edit-delete-btn{border:1px solid #f4a7af;border-radius:999px;padding:14px 16px;
      font-size:.88rem;font-weight:700;cursor:pointer;background:#fff1f2;color:#a4161a;box-shadow:none}
    /* トースト */
    .toast{display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);
      background:#2e9f62;color:#fff;border-radius:999px;padding:12px 24px;
      font-size:.95rem;font-weight:800;z-index:400;box-shadow:0 6px 20px rgba(30,100,50,.28);
      white-space:nowrap;animation:toastIn .2s ease}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    /* PINKメーター */
    .pink-box{background:linear-gradient(135deg,#ffe3ef,#fff7fb);border:2px solid #ffc3dc}
    .pink-title{display:flex;justify-content:space-between;align-items:center;
      font-weight:800;color:#a6164b;margin-bottom:8px}
    .meter{height:14px;background:#ffeef5;border-radius:999px;overflow:hidden;border:1px solid #ffc3dc}
    .meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff7baa,#ff2f79);
      border-radius:999px;transition:width .3s ease}
    .pink-message{margin-top:8px;font-size:.88rem;font-weight:700}
    .budget-list{display:grid;gap:10px}
    .budget-row{padding:11px 12px;background:#fff9ed;border:1px solid var(--line);border-radius:12px}
    .budget-head{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;font-weight:800}
    .budget-track{height:9px;background:#eee5d4;border-radius:999px;overflow:hidden;margin-top:7px}
    .budget-fill{height:100%;background:var(--safe);border-radius:999px}
    .budget-note{font-size:.77rem;color:var(--muted);margin-top:5px}
    .plan-link{display:inline-flex;margin-top:10px;text-decoration:none;border-radius:999px;
      padding:8px 14px;background:#fff3d1;border:1px solid #ebd19a;color:#5b3a05;font-size:.84rem;font-weight:800}

    /* カテゴリ別集計 */
    .grandma-summary{padding:13px 14px;margin-bottom:12px;border-radius:14px;
      background:linear-gradient(135deg,#f4ecff,#fff9ff);border:2px solid #d9c2f3}
    .grandma-total{display:flex;align-items:center;justify-content:space-between;gap:10px;
      font-size:1rem;font-weight:900;color:#633790}
    .grandma-total strong{font-size:1.25rem;white-space:nowrap}
    .grandma-breakdown{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;
      font-size:.8rem;font-weight:700;color:#735b86}
    .category-list{display:grid;gap:8px}
    .category-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px 12px;background:#fff9ed;border:1px solid var(--line);border-radius:12px}
    .category-name{font-size:.9rem;font-weight:800}
    .category-amount{font-size:.95rem;font-weight:900;white-space:nowrap}
    .category-detail-toggle{width:100%;margin:0 0 10px;padding:9px 12px;
      background:#fff3d1;border:1px solid #ebd19a;box-shadow:none;color:#5b3a05;
      font-size:.84rem}

    /* 最近の入力 */
    .recent-list{display:grid;gap:8px}
    .recent-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;
      padding:10px 12px;background:#fffdf8;border:1px solid var(--line);border-radius:12px;font-size:.88rem}
    .recent-date{color:var(--muted);font-size:.82rem;white-space:nowrap}
    .recent-detail{min-width:0}
    .recent-memo{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .recent-payment{font-size:.78rem;color:var(--muted);margin-top:2px}
    .recent-amount{font-weight:800;font-size:.98rem;white-space:nowrap;text-align:right}
    .tag{display:inline-block;padding:2px 7px;border-radius:999px;
      background:#f4ead8;font-size:.74rem;font-weight:700}
    .tag.pink-tag{background:#ffe1ee;color:#a6164b}

    /* ボタン共通 */
    button{border:none;border-radius:999px;padding:11px 18px;font-size:.95rem;font-weight:800;
      cursor:pointer;background:var(--main);color:#3e2600;
      box-shadow:0 4px 10px rgba(160,105,25,.16);display:inline-flex;align-items:center;
      justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
    button.secondary{background:#fff3d1;border:1px solid #ebd19a;box-shadow:none}
    button.mini{padding:7px 12px;font-size:.82rem;box-shadow:none}

    /* 入力FABボタン */
    .fab-area{position:fixed;bottom:0;left:0;right:0;z-index:100;
      display:flex;justify-content:center;gap:8px;padding:12px 16px;
      background:linear-gradient(to top,var(--bg) 70%,transparent);
      pointer-events:none}
    .fab{pointer-events:auto;border:none;border-radius:999px;
      padding:15px 22px;font-size:1rem;font-weight:900;
      cursor:pointer;background:linear-gradient(135deg,#ffb84d,#ff8c00);color:#3e2600;
      box-shadow:0 6px 24px rgba(180,100,0,.32);letter-spacing:.04em}

    .loading{text-align:center;color:var(--muted);padding:24px;font-size:.92rem}
    .empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:.9rem}

    @media(max-width:480px){
      .summary-grid{grid-template-columns:1fr 1fr}
      .summary-grid .summary-box:last-child{grid-column:1/-1}
    }
  </style>
</head>
<body>
  <header>
    <h1>💰 家計簿</h1>
    <p>今月のお金の流れを確認する</p>
  </header>
  <main class="app">

    <!-- ☁️ クラウド設定（常に最上部・アコーディオン） -->
    <div class="card sync-box">
      <div class="sync-head" id="syncHead">
        <h2>☁️ クラウド設定</h2>
        <div class="sync-head-right">
          <span class="sync-badge idle" id="syncBadge">未同期</span>
          <span class="sync-toggle-icon" id="syncIcon">▼</span>
        </div>
      </div>
      <div class="sync-body" id="syncBody" style="display:none">
        <label class="form-label" for="apiUrl">API URL</label>
        <input class="text-input" type="url" id="apiUrl" placeholder="https://api.cetus.fun/api/app-data">
        <label class="form-label" for="apiPassword">保存用パスワード</label>
        <input class="pass-input" type="password" id="apiPassword" placeholder="パスワードを入力">
        <label class="inline-check"><input type="checkbox" id="autoCloudSave"> 保存のたびにクラウドへ自動保存</label>
        <div class="btn-row">
          <button type="button" id="loadCloud">クラウドから読み込み</button>
          <button type="button" class="secondary" id="saveCloud">今すぐ保存</button>
        </div>
        <div class="sync-status" id="syncStatus">まだ同期していません。</div>
        <p class="hint">パスワードはこの端末のブラウザ内のみに保存されます。</p>
      </div>
    </div>

    <!-- 月ナビ -->
    <div class="month-nav">
      <button class="nav-btn" id="prevMonth">← 前月</button>
      <strong id="currentMonthLabel">読み込み中</strong>
      <button class="nav-btn" id="nextMonth">翌月 →</button>
    </div>
    <div class="view-switch">
      <label><input type="radio" name="viewMode" value="settle" checked> 引落・反映月で見る</label>
      <label><input type="radio" name="viewMode" value="use"> 利用日で見る</label>
    </div>

    <!-- 今月の合計 -->
    <div class="card" data-collapse-key="summary">
      <h2>📊 今月の合計</h2>
      <div class="summary-grid">
        <div class="summary-box"><div class="summary-label">収入</div><div class="summary-value" id="incomeTotal">―</div></div>
        <div class="summary-box"><div class="summary-label">支出</div><div class="summary-value" id="expenseTotal">―</div></div>
        <div class="summary-box"><div class="summary-label">差し引き</div><div class="summary-value" id="balanceTotal">―</div></div>
      </div>
      <div class="income-note" id="incomeNote"></div>
    </div>

    <!-- 支払い元別 -->
    <div class="card" data-collapse-key="payments">
      <h2>💳 支払い元別 支出</h2>
      <div class="payment-list" id="paymentList">
        <div class="loading">読み込み中…</div>
      </div>
    </div>

    <!-- カテゴリ別 -->
    <div class="card" data-collapse-key="categories">
      <h2>🗂 カテゴリ別 支出</h2>
      <div class="grandma-summary">
        <div class="grandma-total"><span>👵 祖母関連 合計</span><strong id="grandmaTotal">0円</strong></div>
        <div class="grandma-breakdown">
          <span>医療費：<strong id="grandmaMedical">0円</strong></span>
          <span>利用分：<strong id="grandmaUse">0円</strong></span>
        </div>
      </div>
      <button type="button" class="category-detail-toggle" id="toggleCategoryDetails">▶ その他のカテゴリを開く</button>
      <div id="categoryDetails" hidden>
        <div class="category-list" id="categoryList">
          <div class="loading">読み込み中…</div>
        </div>
      </div>
    </div>

    <!-- PINKカード監視 -->
    <div class="card pink-box" data-collapse-key="pink">
      <div class="pink-title">
        <span>🌸 楽天PINKカード</span>

  <script>
    const STORAGE_KEY  = "kakeibo-app-stable-v3";
    const PLAN_KEY     = "kakeibo-plan-v1";
    const SETTINGS_KEY = "kakeibo-cloud-settings-v1";
    const DELETED_KEY  = "kakeibo-deleted-ids-v1";
    const BACKUP_KEY   = "kakeibo-local-backups-v1";
    const APP_KEY      = "kakeibo-app";
    const APP_VERSION  = 5;
    const DEFAULT_API  = "https://api.cetus.fun/api/app-data";
    const COLLAPSE_KEY = "kakeibo-collapsed-sections-v1";
    const CATEGORY_DETAIL_KEY = "kakeibo-category-details-open-v1";
    const DEFAULT_PLAN = {
      version:1,
      pinkGoal:50000,
      categoryBudgets:{"おやつ":4000},
      funds:[],
      fundTransactions:[]
    };
    const PAYMENTS     = ["楽天PINK","楽天VISA","現金","auじぶん銀行"];

    let entries      = [];
    let plan         = structuredClone(DEFAULT_PLAN);
    let currentMonth = new Date();
    currentMonth.setDate(1);

    /* ── ユーティリティ ── */
    function $(id){return document.getElementById(id)}
    function yen(v){return Number(v||0).toLocaleString("ja-JP")+"円"}
    function pad(n){return String(n).padStart(2,"0")}
    function monthString(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
    function makeId(){return crypto.randomUUID ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(36).slice(2)}
    function htmlEsc(v){return String(v==null?"":v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
    function normalizePaymentName(n){
      return String(n||"").toLowerCase().replace(/\s/g,"")
        .replace("楽天ピンク","楽天pink").replace("rakutenpink","楽天pink")
        .replace("楽天ビザ","楽天visa");
    }

    function loadDeletedIds(){
      try{ const v=JSON.parse(localStorage.getItem(DELETED_KEY)||"[]"); return Array.isArray(v)?v:[]; }
      catch(e){ return []; }
    }
    function saveDeletedIds(list){ localStorage.setItem(DELETED_KEY,JSON.stringify(list)); }
    function addDeletedId(id){
      const merged=mergeDeletedIds(loadDeletedIds(),[{id,deletedAt:new Date().toISOString()}]);
      saveDeletedIds(merged);
    }
    function backupLocal(reason){
      try{
        const raw=JSON.parse(localStorage.getItem(BACKUP_KEY)||"[]");
        const list=Array.isArray(raw)?raw:[];
        list.unshift({savedAt:new Date().toISOString(),reason:reason||"自動バックアップ",entries:entries.map(normalizeEntry),deletedIds:loadDeletedIds(),plan:normalizePlan(plan)});
        localStorage.setItem(BACKUP_KEY,JSON.stringify(list.slice(0,5)));
      }catch(e){ /* 容量不足時も本体処理は続行 */ }
    }
    function mergeDeletedIds(a,b){
      const map=new Map();
      [...(Array.isArray(a)?a:[]),...(Array.isArray(b)?b:[])].forEach(x=>{
        const item=typeof x==="string"?{id:x,deletedAt:""}:x;
        if(!item||!item.id)return;
        const old=map.get(item.id);
        if(!old||String(item.deletedAt||"")>String(old.deletedAt||""))map.set(item.id,item);
      });
      return [...map.values()];
    }
    function mergeEntries(a,b,deletedIds){
      const deleted=new Set((deletedIds||[]).map(x=>typeof x==="string"?x:x.id));
      const map=new Map();
      [...(Array.isArray(a)?a:[]),...(Array.isArray(b)?b:[])].forEach(raw=>{
        if(!raw)return;
        const e=normalizeEntry(raw);
        if(deleted.has(e.id))return;
        const old=map.get(e.id);
        const stamp=x=>Date.parse(x.updatedAt||x.createdAt||0)||0;
        if(!old||stamp(e)>=stamp(old))map.set(e.id,e);
      });
      return [...map.values()];
    }

    /* ── 各カードの折りたたみ ── */
    function loadCollapsedSections(){
      try{
        const saved = JSON.parse(localStorage.getItem(COLLAPSE_KEY)||"null");
        if(saved && typeof saved === "object") return saved;
      }catch(e){}
      // 初回は「今月の合計」と「カテゴリ別」だけ開く
      return {summary:false,payments:true,categories:false,pink:true,budgets:true,funds:true,recent:true};
    }

    function setupCollapsibleCards(){
      const states = loadCollapsedSections();
      document.querySelectorAll("main.app > .card[data-collapse-key]").forEach(card => {
        const key = card.dataset.collapseKey;
        const head = card.querySelector(":scope > h2, :scope > .pink-title");
        if(!head) return;

        card.classList.add("collapsible-card");
        head.classList.add("collapse-head");
        head.setAttribute("role","button");
        head.setAttribute("tabindex","0");

        const content = document.createElement("div");
        content.className = "collapse-content";
        while(head.nextSibling) content.appendChild(head.nextSibling);
        card.appendChild(content);

        const icon = document.createElement("span");
        icon.className = "collapse-icon";
        head.appendChild(icon);

        function setCollapsed(collapsed,save){
          card.classList.toggle("collapsed",collapsed);
          content.hidden = collapsed;
          icon.textContent = collapsed ? "▶ 開く" : "▼ 閉じる";
          head.setAttribute("aria-expanded",String(!collapsed));
          if(save){
            states[key] = collapsed;
            localStorage.setItem(COLLAPSE_KEY,JSON.stringify(states));
          }
        }
        function toggle(){ setCollapsed(!card.classList.contains("collapsed"),true); }
        head.addEventListener("click",toggle);
        head.addEventListener("keydown",e=>{
          if(e.key==="Enter" || e.key===" "){ e.preventDefault(); toggle(); }
        });
        setCollapsed(!!states[key],false);
      });
    }

    function setupCategoryDetails(){
      const details = $("categoryDetails");
      const button = $("toggleCategoryDetails");
      let isOpen = localStorage.getItem(CATEGORY_DETAIL_KEY) === "1";
      function apply(){
        details.hidden = !isOpen;
        button.textContent = isOpen ? "▼ その他のカテゴリを閉じる" : "▶ その他のカテゴリを開く";
        button.setAttribute("aria-expanded",String(isOpen));
      }
      button.addEventListener("click",()=>{
        isOpen = !isOpen;
        localStorage.setItem(CATEGORY_DETAIL_KEY,isOpen ? "1" : "0");
        apply();
      });
      apply();
    }

    function normalizeEntry(e){
      return {
        id:          e.id || makeId(),
        date:        e.date || "",
        type:        e.type === "income" ? "income" : "expense",
        amount:      Number(e.amount || 0),
        payment:     e.payment || "その他",
        category:    e.category || "その他",
        settleMonth: e.settleMonth || (e.date ? String(e.date).slice(0,7) : monthString(new Date())),
        memo:        e.memo || "",
        receiptId:   e.receiptId || "",
        receiptTotal:Number(e.receiptTotal || 0),
        splitIndex:  Number(e.splitIndex || 0),
        splitCount:  Number(e.splitCount || 0),
        createdAt:   e.createdAt || new Date().toISOString(),
        updatedAt:   e.updatedAt || e.createdAt || new Date().toISOString()
      };
    }

    function normalizePlan(raw){
      const p = raw && typeof raw === "object" ? raw : {};
      return {
        version:1,
        pinkGoal:Math.max(0,Number(p.pinkGoal ?? DEFAULT_PLAN.pinkGoal)),
        categoryBudgets:p.categoryBudgets && typeof p.categoryBudgets === "object"
          ? p.categoryBudgets : {...DEFAULT_PLAN.categoryBudgets},
        funds:Array.isArray(p.funds) ? p.funds : [],
        fundTransactions:Array.isArray(p.fundTransactions) ? p.fundTransactions : []
      };
    }

    /* ── ストレージ ── */
    function loadEntries(){
      try{
        const saved = localStorage.getItem(STORAGE_KEY);
        if(saved){ entries = JSON.parse(saved||"[]").map(normalizeEntry); return; }
        for(const key of ["kakeibo-app-stable-v2","kakeibo-app-stable-v1"]){
          const leg = localStorage.getItem(key);
          if(leg){ entries = JSON.parse(leg||"[]").map(normalizeEntry); saveLocal(); return; }
        }
        entries = [];
      }catch(e){ entries = []; }
    }
    function loadPlan(){
      try{ plan = normalizePlan(JSON.parse(localStorage.getItem(PLAN_KEY)||"null")); }
      catch(e){ plan = normalizePlan(null); }
    }
    function saveLocal(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
    }

    /* ── クラウド設定 ── */
    function getCloudSettings(){
      try{
        const s = JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");
        return { apiUrl:s.apiUrl||DEFAULT_API, password:s.password||"", autoCloudSave:!!s.autoCloudSave };
      }catch(e){ return {apiUrl:DEFAULT_API,password:"",autoCloudSave:false}; }
    }
    function saveCloudSettings(){
      const s = { apiUrl:$("apiUrl").value.trim()||DEFAULT_API, password:$("apiPassword").value, autoCloudSave:$("autoCloudSave").checked };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
      return s;
    }
    function loadCloudSettingsToForm(){
      const s = getCloudSettings();
      $("apiUrl").value          = s.apiUrl || DEFAULT_API;
      $("apiPassword").value     = s.password || "";
      $("autoCloudSave").checked = !!s.autoCloudSave;
    }

    /* ── アコーディオン開閉 ── */
    let syncOpen = false;
    function openSync(){ syncOpen=true;  $("syncBody").style.display="block"; $("syncIcon").textContent="▲"; }
    function closeSync(){ syncOpen=false; $("syncBody").style.display="none";  $("syncIcon").textContent="▼"; }
    function toggleSync(){ syncOpen ? closeSync() : openSync(); }

    /* ── バッジ更新 ── */
    function setSyncBadge(text, kind){
      const b = $("syncBadge");
      b.textContent = text;
      b.className = "sync-badge " + (kind||"idle");
    }

    /* ── ステータス更新 ── */
    function setSyncStatus(msg, kind){
      const el = $("syncStatus");
      el.textContent = msg;
      el.className = "sync-status" + (kind ? " "+kind : "");
      if(kind === "ok"){
        setSyncBadge("✓ 同期済み","ok");
        // 成功後1.5秒で自動で閉じる
        setTimeout(closeSync, 1500);
      } else if(kind === "ng"){
        setSyncBadge("エラー","ng");
      }
    }

    /* ── 安全なクラウド同期：必ず取得→合流→保存 ── */
    async function fetchCloudData(s){
      const url=new URL(s.apiUrl);
      url.searchParams.set("key",APP_KEY);
      const res=await fetch(url.toString(),{method:"GET",headers:{"X-App-Password":s.password}});
      const text=await res.text();
      let json={};try{json=text?JSON.parse(text):{};}catch(e){}
      if(!res.ok)throw new Error((json&&(json.error||json.message))||"HTTP "+res.status);
      const root=json&&typeof json==="object"?json:{};
      const data=root.data&&typeof root.data==="object"?root.data:root;
      if(!data||!Array.isArray(data.entries))throw new Error("クラウドデータを確認できません");
      return data;
    }

    async function postCloudData(s,payload){
      const res=await fetch(s.apiUrl,{
        method:"POST",
        headers:{"Content-Type":"application/json","X-App-Password":s.password},
        body:JSON.stringify({key:APP_KEY,app:APP_KEY,data:payload})
      });
      const text=await res.text();
      let json={};try{json=text?JSON.parse(text):{};}catch(e){}
      if(!res.ok)throw new Error((json&&(json.error||json.message))||"HTTP "+res.status);
    }

    async function mergeAndSaveCloud(s){
      // GETに失敗したらPOSTへ進まない。少ない端末データでの全件上書きを禁止する。
      const cloud=await fetchCloudData(s);
      const deletedIds=mergeDeletedIds(loadDeletedIds(),cloud.deletedIds);
      const merged=mergeEntries(cloud.entries,entries,deletedIds);
      backupLocal("クラウド合流前");
      entries=merged;
      saveDeletedIds(deletedIds);
      if(cloud.plan)plan=normalizePlan(cloud.plan);
      saveLocal();
      const payload={app:APP_KEY,version:APP_VERSION,entries:merged,deletedIds,plan:normalizePlan(plan),savedAt:new Date().toISOString()};
      await postCloudData(s,payload);
      render();
      return payload;
    }

    async function saveToCloud(opts){
      const silent=opts&&opts.silent;
      const s=saveCloudSettings();
      if(!s.password){if(!silent)setSyncStatus("パスワードを入力してから保存してください。","ng");return false;}
      try{
        if(!silent)setSyncStatus("クラウド最新版を確認して安全に合流中…");
        await mergeAndSaveCloud(s);
        setSyncStatus("クラウドと安全に合流・保存しました："+new Date().toLocaleString("ja-JP"),"ok");
        return true;
      }catch(err){
        setSyncStatus("安全確認できないためクラウドを変更しませんでした："+err.message,"ng");
        return false;
      }
    }

    async function loadFromCloud(opts){
      const silent = !!(opts && opts.silent);
      const s = saveCloudSettings();
      if(!s.password){ if(!silent)setSyncStatus("パスワードを入力してから読み込んでください。","ng"); return false; }
      if(!silent && !confirm("端末データとクラウドデータを安全に合流しますか？（どちらか一方だけで上書きはしません）")) return false;
      try{
        setSyncStatus(silent ? "起動時にクラウドと同期中…" : "クラウドから読み込み中…");
        const cloudData=await fetchCloudData(s);
        const deletedIds=mergeDeletedIds(loadDeletedIds(),cloudData.deletedIds);
        backupLocal("クラウド読込・合流前");
        entries=mergeEntries(cloudData.entries,entries,deletedIds);
        saveDeletedIds(deletedIds);
        if(cloudData.plan) plan = normalizePlan(cloudData.plan);
        saveLocal();
        await postCloudData(s,{app:APP_KEY,version:APP_VERSION,entries:entries.map(normalizeEntry),deletedIds,plan:normalizePlan(plan),savedAt:new Date().toISOString()});
        render();
        const savedAt = cloudData.savedAt ? new Date(cloudData.savedAt).toLocaleString("ja-JP") : "不明";
        setSyncStatus((silent ? "端末とクラウドを自動合流しました。クラウド保存：" : "端末とクラウドを合流しました。クラウド保存：")+savedAt,"ok");
        return true;
      }catch(err){
        setSyncStatus("クラウド読込に失敗しました。端末内データを表示します："+err.message,"ng");
        return false;
      }
    }

    /* ── 表示モード ── */
    function viewMode(){
      const r = document.querySelector("input[name='viewMode']:checked");
      return r ? r.value : "settle";
    }
    function entryMonth(e){
      return viewMode() === "use"
        ? String(e.date||"").slice(0,7)
        : (e.settleMonth || String(e.date||"").slice(0,7));
    }

    /* ── レンダリング ── */
    function render(){
      const m = monthString(currentMonth);
      $("currentMonthLabel").textContent = m.replace("-","年")+"月";

      const monthEntries = entries.filter(e => entryMonth(e) === m);
      const expenses     = monthEntries.filter(e => e.type === "expense");
      const incomeList   = monthEntries.filter(e => e.type === "income");
      const totalExp     = expenses.reduce((s,e) => s+Number(e.amount||0), 0);
      const totalInc     = incomeList.reduce((s,e) => s+Number(e.amount||0), 0);
      const balance      = totalInc - totalExp;

      $("incomeTotal").textContent  = yen(totalInc);
      $("expenseTotal").textContent = yen(totalExp);
      $("balanceTotal").textContent = yen(balance);
      $("balanceTotal").style.color = balance >= 0 ? "var(--safe)" : "var(--danger)";
      $("incomeNote").textContent   = (viewMode()==="use" ? "利用日" : "引落・反映月") + "ベースで集計しています。";

      renderPayments(expenses);
      renderCategories(expenses);
      renderPink(m);
      renderBudgets(m);
      renderFunds();
      renderRecent(monthEntries);
    }

    function renderPayments(expenses){
      const area = $("paymentList");
      const rows = PAYMENTS.map(name => {
        const total = expenses
          .filter(e => normalizePaymentName(e.payment) === normalizePaymentName(name))
          .reduce((s,e) => s+Number(e.amount||0), 0);
        return {name, total};
      });
      const grandTotal = rows.reduce((s,r) => s+r.total, 0);
      const rakutenTotal = rows
        .filter(r => ["楽天PINK","楽天VISA"].some(name =>
          normalizePaymentName(r.name) === normalizePaymentName(name)))
        .reduce((s,r) => s+r.total, 0);
      if(grandTotal === 0){
        area.innerHTML = '<div class="empty">今月の支出はまだありません</div>'; return;
      }
      area.innerHTML = `<div class="rakuten-total">
        <span class="rakuten-total-label">💳 楽天カード2枚 合計</span>
        <span class="rakuten-total-amount">${yen(rakutenTotal)}</span>
      </div>` + rows.map(r => {
        const isPink = normalizePaymentName(r.name) === normalizePaymentName("楽天PINK");
        return `<div class="payment-row${isPink?" pink":""}" data-payment="${htmlEsc(r.name)}">
          <div class="payment-name-wrap">
            <span class="payment-name">${htmlEsc(r.name)}</span>
            <span class="payment-chevron">▶ 履歴</span>
          </div>
          <span class="payment-amount">${yen(r.total)}</span>
        </div>`;
      }).join("") +
      `<div class="payment-row no-click" style="background:#f5f2ea;border-color:#d8cdb4">
        <span class="payment-name" style="color:var(--muted)">合計</span>
        <span class="payment-amount">${yen(grandTotal)}</span>
      </div>`;

      // 各行クリックでドロワー
      area.querySelectorAll(".payment-row[data-payment]").forEach(row => {
        row.addEventListener("click", () => openDrawer(row.dataset.payment));
      });
    }

    function renderCategories(expenses){
      const totals = new Map();
      expenses.forEach(e => {
        const category = e.category || "その他";
        totals.set(category, (totals.get(category)||0) + Number(e.amount||0));
      });

      const grandmaMedical = totals.get("祖母・医療費") || 0;
      const grandmaUse = totals.get("祖母・利用分") || 0;
      $("grandmaMedical").textContent = yen(grandmaMedical);
      $("grandmaUse").textContent = yen(grandmaUse);
      $("grandmaTotal").textContent = yen(grandmaMedical + grandmaUse);

      const rows = [...totals.entries()]
        .filter(([name]) => name !== "祖母・医療費" && name !== "祖母・利用分")
        .sort((a,b) => b[1]-a[1]);
      const area = $("categoryList");
      if(!rows.length){
        area.innerHTML = '<div class="empty">その他のカテゴリ支出はありません</div>'; return;
      }
      area.innerHTML = rows.map(([name,total]) =>
        `<div class="category-row"><span class="category-name">${htmlEsc(name)}</span><span class="category-amount">${yen(total)}</span></div>`
      ).join("");
    }

    /* ── 履歴ドロワー ── */
    let drawerPayment = "";
    let drawerMonthFilter = "all"; // "all" or "YYYY-MM"

    function openDrawer(paymentName){
      drawerPayment = paymentName;
      drawerMonthFilter = "all";
      $("drawerTitle").textContent = paymentName + " の履歴";
      renderDrawerFilter();
      renderDrawerList();
      $("drawerOverlay").classList.add("open");
      // 次フレームでアニメーション
      requestAnimationFrame(() => $("drawer").classList.add("open"));
    }

    function closeDrawer(){
      $("drawer").classList.remove("open");
      $("drawerOverlay").classList.remove("open");
    }

    function renderDrawerFilter(){
      // その支払い元が存在する月を抽出
      const months = [...new Set(
        entries
          .filter(e => normalizePaymentName(e.payment) === normalizePaymentName(drawerPayment))
          .map(e => e.settleMonth || String(e.date||"").slice(0,7))
          .filter(Boolean)
      )].sort((a,b) => b.localeCompare(a));

      const area = $("drawerFilter");
      area.innerHTML = `<button class="filter-btn${drawerMonthFilter==="all"?" active":""}" data-m="all">すべて</button>` +
        months.map(m => `<button class="filter-btn${drawerMonthFilter===m?" active":""}" data-m="${htmlEsc(m)}">${m.replace("-","年")}月</button>`).join("");

      area.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          drawerMonthFilter = btn.dataset.m;
          renderDrawerFilter();
          renderDrawerList();
        });
      });
    }

    function renderDrawerList(){
      const list = entries
        .filter(e => {
          if(normalizePaymentName(e.payment) !== normalizePaymentName(drawerPayment)) return false;
          if(drawerMonthFilter !== "all"){
            const em = e.settleMonth || String(e.date||"").slice(0,7);
            if(em !== drawerMonthFilter) return false;
          }
          return true;
        })
        .sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));

      const total = list.filter(e=>e.type==="expense").reduce((s,e)=>s+Number(e.amount||0),0);
      const income= list.filter(e=>e.type==="income").reduce((s,e)=>s+Number(e.amount||0),0);

      $("drawerTotal").textContent =
        `${list.length}件　支出合計：${yen(total)}` + (income>0 ? `　収入：${yen(income)}` : "");

      if(list.length === 0){
        $("drawerList").innerHTML = '<div class="drawer-empty">該当する入力がありません</div>'; return;
      }

      $("drawerList").innerHTML = list.map(e => {
        const isIncome = e.type === "income";
        const settle   = e.settleMonth || String(e.date||"").slice(0,7);
        return `<div class="history-item">
          <div class="history-item-top">
            <span class="history-date">${htmlEsc(e.date||"")}</span>
            <div class="history-detail">
              <div class="history-memo">${htmlEsc(e.memo || e.category || (isIncome?"収入":"支出"))}</div>
              <div class="history-sub">引落：${htmlEsc(settle)}　${htmlEsc(e.category||"")}</div>
            </div>
            <span class="history-amount${isIncome?" income":""}">${isIncome?"+":""}${yen(e.amount)}</span>
          </div>
          <button type="button" class="history-edit-btn" data-id="${htmlEsc(e.id)}">✏️ 編集・削除</button>
        </div>`;
      }).join("");

      // 編集ボタンにイベント登録
      $("drawerList").querySelectorAll(".history-edit-btn").forEach(btn => {
        btn.addEventListener("click", () => openEditModal(btn.dataset.id));
      });
    }

    /* ── 編集モーダル ── */
    let editingId   = null;
    let editingType = "expense";

    function openEditModal(id){
      const e = entries.find(x => x.id === id);
      if(!e) return;
      editingId   = id;
      editingType = e.type || "expense";

      $("editDate").value         = e.date || "";
      $("editAmount").value       = e.amount || "";
      $("editMemo").value         = e.memo || "";
      $("editSettleMonth").value  = e.settleMonth || String(e.date||"").slice(0,7);
      $("editCategory").value     = e.category || "その他";

      // 種別ボタン
      setEditType(editingType);

      // 支払い元グリッド
      renderEditPayGrid(e.payment);

      $("editOverlay").classList.add("open");
    }

    function setEditType(type){
      editingType = type;
      $("editTypeExpense").className = "edit-type-btn" + (type==="expense" ? " sel-expense" : "");
      $("editTypeIncome").className  = "edit-type-btn" + (type==="income"  ? " sel-income"  : "");
    }

    function renderEditPayGrid(current){
      $("editPayGrid").innerHTML = PAYMENTS.map(p => {
        const isPink = normalizePaymentName(p) === normalizePaymentName("楽天PINK");
        const isSel  = normalizePaymentName(current) === normalizePaymentName(p);
        const cls    = isSel ? (isPink ? " sel-pink" : " sel") : "";
        return `<button type="button" class="edit-pay-btn${cls}" data-pay="${htmlEsc(p)}">${htmlEsc(p)}</button>`;
      }).join("");
      $("editPayGrid").querySelectorAll(".edit-pay-btn").forEach(btn => {
        btn.addEventListener("click", () => renderEditPayGrid(btn.dataset.pay));
      });
    }

    function getEditSelectedPayment(){
      const sel = $("editPayGrid").querySelector(".sel,.sel-pink");
      return sel ? sel.dataset.pay : "";
    }

    function closeEditModal(){
      $("editOverlay").classList.remove("open");
      editingId = null;
    }

    function showToast(msg, color){
      const t = $("toast");
      t.textContent = msg;
      t.style.background = color || "#2e9f62";
      t.style.display = "block";
      clearTimeout(t._t);
      t._t = setTimeout(() => { t.style.display="none"; }, 2200);
    }

    async function saveEdit(){
      const amount = Number($("editAmount").value);
      if(!amount || amount <= 0){ alert("金額を入力してください。"); return; }
      const date = $("editDate").value;
      if(!date){ alert("日付を入力してください。"); return; }
      const payment = getEditSelectedPayment();
      if(!payment){ alert("支払い元を選択してください。"); return; }

      const idx = entries.findIndex(e => e.id === editingId);
      if(idx < 0) return;

      backupLocal("編集前");
      entries[idx] = normalizeEntry({
        ...entries[idx],
        type:        editingType,
        date,
        amount,
        payment,
        memo:        $("editMemo").value.trim(),
        category:    $("editCategory").value || "その他",
        settleMonth: $("editSettleMonth").value || date.slice(0,7),
        updatedAt:   new Date().toISOString()
      });

      saveLocal();
      await saveToCloudSilent();
      render();
      renderDrawerFilter();
      renderDrawerList();
      closeEditModal();
      showToast("✅ 保存しました");
    }

    async function deleteEntry(){
      if(!confirm("この1件を削除しますか？")) return;
      backupLocal("削除前");
      addDeletedId(editingId);
      entries = entries.filter(e => e.id !== editingId);
      saveLocal();
      await saveToCloudSilent();
      render();
      renderDrawerFilter();
      renderDrawerList();
      closeEditModal();
      showToast("🗑 削除しました", "#e63946");
    }

    /* サイレントクラウド保存も必ず取得→合流。取得失敗時は上書き禁止。 */
    async function saveToCloudSilent(){
      const s = getCloudSettings();
      if(!s.password || !s.autoCloudSave) return false;
      try{
        await mergeAndSaveCloud(s);
        return true;
      }catch(e){
        setSyncStatus("端末には保存しましたが、安全確認できないためクラウドは変更していません。","ng");
        return false;
      }
    }

    function forecastForMonth(total, m){
      const now = new Date();
      const todayMonth = monthString(new Date(now.getFullYear(),now.getMonth(),1));
      if(m !== todayMonth) return total;
      const days = new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
      return Math.round(total / Math.max(1,now.getDate()) * days);
    }

    function renderPink(m){
      const expenses = entries.filter(e => e.type === "expense" && String(e.date||"").slice(0,7) === m);
      const total = expenses
        .filter(e => normalizePaymentName(e.payment) === normalizePaymentName("楽天PINK"))
        .reduce((s,e) => s+Number(e.amount||0), 0);
      const goal = Math.max(1,Number(plan.pinkGoal||50000));
      const forecast = forecastForMonth(total,m);
      $("pinkTotal").textContent = yen(total);
      $("pinkMeter").style.width = Math.min((total/goal)*100, 100) + "%";
      $("pinkMeter").style.background = total >= goal ? "var(--danger)" : total >= goal*.7 ? "#f0a020" : "linear-gradient(90deg,#ff7baa,#ff2f79)";
      $("pinkHint").textContent = "利用日ベースの目標："+yen(goal);
      if(total===0) $("pinkMessage").textContent = "今月のPINK利用はまだ0円。";
      else if(total>goal) $("pinkMessage").textContent = "目標を "+yen(total-goal)+" オーバー。";
      else if(forecast>goal) $("pinkMessage").textContent = "このペースだと月末 "+yen(forecast)+"。約 "+yen(forecast-goal)+" オーバー予想。";
      else $("pinkMessage").textContent = "あと "+yen(goal-total)+"。月末予想は "+yen(forecast)+"。";
    }

    function renderBudgets(m){
      const area = $("budgetList");
      const budgets = Object.entries(plan.categoryBudgets||{}).filter(([,v]) => Number(v)>0);
      if(!budgets.length){ area.innerHTML='<div class="empty">予算はまだ設定されていません</div>'; return; }
      const useExpenses = entries.filter(e => e.type==="expense" && String(e.date||"").slice(0,7)===m);
      area.innerHTML = budgets.map(([name,limit]) => {
        limit=Number(limit);
        const used=useExpenses.filter(e=>e.category===name).reduce((s,e)=>s+Number(e.amount||0),0);
        const pct=Math.min(used/limit*100,100);
        const forecast=forecastForMonth(used,m);
        const color=used>=limit?"var(--danger)":forecast>limit?"#f0a020":"var(--safe)";
        const note=used>limit ? yen(used-limit)+"オーバー"
          : forecast>limit ? "月末予想 "+yen(forecast)+"（超過見込み）"
          : "残り "+yen(limit-used)+" ／ 月末予想 "+yen(forecast);
        return `<div class="budget-row"><div class="budget-head"><span>${htmlEsc(name)}</span><span>${yen(used)} / ${yen(limit)}</span></div>
          <div class="budget-track"><div class="budget-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="budget-note">${note}</div></div>`;
      }).join("");
    }

    function renderFunds(){
      const area=$("fundList");
      const funds=Array.isArray(plan.funds)?plan.funds:[];
      if(!funds.length){ area.innerHTML='<div class="empty">積み立て先はまだありません</div>'; return; }
      area.innerHTML=funds.map(f=>{
        const balance=(plan.fundTransactions||[]).filter(t=>t.fundId===f.id)
          .reduce((s,t)=>s+(t.type==="withdraw"?-1:1)*Number(t.amount||0),0);
        return `<div class="budget-row"><div class="budget-head"><span>${htmlEsc(f.name)}</span><span>${yen(balance)}</span></div>
          <div class="budget-note">毎月の目安 ${yen(f.monthlyTarget||0)}</div></div>`;
      }).join("");
    }

    function renderRecent(monthEntries){
      const area = $("recentList");
      const grouped = [];
      const receipts = new Map();
      monthEntries.forEach(e => {
        if(!e.receiptId){ grouped.push(e); return; }
        if(!receipts.has(e.receiptId)){
          const item={...e,amount:Number(e.receiptTotal||e.amount),category:"",_categories:[]};
          receipts.set(e.receiptId,item); grouped.push(item);
        }
        const item=receipts.get(e.receiptId);
        if(e.category && !item._categories.includes(e.category)) item._categories.push(e.category);
        item.category=item._categories.join("・");
      });
      const list = grouped
        .sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")))
        .slice(0,20);
      if(list.length === 0){
        area.innerHTML = '<div class="empty">今月の入力はまだありません</div>'; return;
      }
      area.innerHTML = list.map(e => {
        const isPink   = normalizePaymentName(e.payment) === normalizePaymentName("楽天PINK");
        const typeLabel = e.type === "income" ? "収入" : "支出";
        const amtColor  = e.type === "income" ? "var(--safe)" : "var(--text)";
        return `<div class="recent-item">
          <span class="recent-date">${htmlEsc(e.date||"")}</span>
          <div class="recent-detail">
            <div class="recent-memo">${htmlEsc(e.memo || e.category || typeLabel)}</div>
            <div class="recent-payment">
              <span class="tag${isPink?" pink-tag":""}">${htmlEsc(e.payment)}</span>
              ${e.memo && e.category ? `<span class="tag" style="margin-left:4px">${htmlEsc(e.category)}</span>` : ""}
            </div>
          </div>
          <span class="recent-amount" style="color:${amtColor}">${e.type==="income"?"+":""}${yen(e.amount)}</span>
        </div>`;
      }).join("");
    }

    /* ── 初期化 ── */
    async function init(){
      loadEntries();
      loadPlan();
      loadCloudSettingsToForm();
      setupCollapsibleCards();
      setupCategoryDetails();
      render();

      // アコーディオン：パスワード未設定なら最初から開く
      const _s = getCloudSettings();
      if(!_s.password){ openSync(); } else { setSyncBadge("✓ 設定済み","ok"); }

      $("syncHead").addEventListener("click", toggleSync);
      $("loadCloud").addEventListener("click", loadFromCloud);
      $("saveCloud").addEventListener("click", () => saveToCloud({silent:false}));
      $("apiUrl").addEventListener("change", saveCloudSettings);
      $("apiPassword").addEventListener("change", saveCloudSettings);
      $("autoCloudSave").addEventListener("change", saveCloudSettings);

      $("drawerClose").addEventListener("click", closeDrawer);
      $("drawerOverlay").addEventListener("click", closeDrawer);

      $("editCloseBtn").addEventListener("click", closeEditModal);
      $("editOverlay").addEventListener("click", e => { if(e.target===$("editOverlay")) closeEditModal(); });
      $("editTypeExpense").addEventListener("click", () => setEditType("expense"));
      $("editTypeIncome").addEventListener("click",  () => setEditType("income"));
      $("editSaveBtn").addEventListener("click", saveEdit);
      $("editDeleteBtn").addEventListener("click", deleteEntry);

      $("prevMonth").addEventListener("click", () => { currentMonth.setMonth(currentMonth.getMonth()-1); render(); });
      $("nextMonth").addEventListener("click", () => { currentMonth.setMonth(currentMonth.getMonth()+1); render(); });
      document.querySelectorAll("input[name='viewMode']").forEach(r => r.addEventListener("change", render));

      $("goInput").addEventListener("click", () => { location.href = "kakeibo-input.html"; });
      $("goPlan").addEventListener("click", () => { location.href = "kakeibo-plan.html"; });

      // パスワード設定済みなら、起動時はクラウドを自動で最新化する
      if(_s.password) await loadFromCloud({silent:true});

      document.addEventListener("visibilitychange", () => {
        if(!document.hidden){ loadEntries(); loadPlan(); render(); }
      });
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
