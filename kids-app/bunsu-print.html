<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="小学4年生の分数練習。仮分数・単位分数・帯分数の問題を作ってA4に印刷。">
<title>分数プリント工房</title>
<style>
:root{--ink:#24344c;--muted:#536179;--violet:#5c46ad;--line:#dbdfea;--paper:#fff;--lav:#f1ecfb}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#eef0f7;font:16px/1.65 system-ui,"Yu Gothic",Meiryo,sans-serif}
header{background:var(--lav);border-bottom:1px solid #ded5f1}
.hero{max-width:1180px;margin:auto;padding:28px 30px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.eyebrow{font-weight:750;font-size:.8rem;letter-spacing:.12em;color:#4a378e;margin:0}
h1{font-size:clamp(1.85rem,4vw,2.8rem);line-height:1.2;letter-spacing:.025em;margin:7px 0 9px}
.hero p:last-child{margin:0;color:var(--muted)}
.motif{display:flex;gap:8px;transform:rotate(-8deg);padding-right:10px}
.tile{display:grid;place-items:center;width:68px;height:77px;border-radius:14px;background:#fff;color:#50409a;font-size:1.6rem;box-shadow:0 3px 0 #d2c5ee}
.tile:nth-child(2){background:#ffe8a8;color:#5b4419;transform:translateY(12px)}
.workspace{max-width:1180px;margin:auto;padding:28px 30px 42px;display:grid;grid-template-columns:minmax(240px,290px) minmax(0,1fr);gap:28px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.panel h2{font-size:1.14rem;margin:0 0 14px}
label{display:block;font-weight:700;margin:0 0 12px}
select,button{font:inherit}
select{width:100%;margin-top:5px;padding:9px;border:1px solid #aeb7cc;border-radius:8px;color:var(--ink);background:#fff}
.check{display:flex;align-items:center;gap:8px;margin:16px 0;font-size:.91rem}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--violet)}
button{padding:10px 14px;border:1px solid #a99acb;border-radius:9px;cursor:pointer;background:#fff;color:#44377b;font-weight:750}
button.primary{background:var(--violet);border-color:var(--violet);color:#fff}
button:hover{filter:brightness(.95)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #a58ce8;outline-offset:2px}
.actions{display:grid;gap:9px}
.help,.status{font-size:.82rem;color:var(--muted);margin:12px 0 0}
.hint{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);font-size:.86rem}
.hint p{margin:.35em 0}
.preview-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 10px}
.preview-head h2{font-size:1rem;margin:0}
.badge{font-size:.77rem;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.sheet{background:var(--paper);padding:clamp(18px,4vw,36px);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 20px #283c6110}
.sheet+.sheet{margin-top:20px}
.sheet-title{margin:0 0 10px;font-size:1.45rem;line-height:1.35}
.identity{font-size:.84rem;display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px}
.name-line{min-width:130px;border-bottom:1px solid;display:inline-block}
.instructions{font-size:.88rem;background:#f5f2fc;padding:9px 12px;margin:0 0 12px;border-radius:6px}
.questions{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:22px}
.question{display:grid;grid-template-columns:1.65em minmax(0,1fr);align-items:center;gap:.2em;min-height:88px;border-bottom:1px solid #e3e6ee;padding:7px 0;break-inside:avoid}
.num{font-size:.83em;font-weight:700;color:#536179}
.body{display:grid;gap:4px;justify-items:start}
.expression{display:flex;align-items:center;gap:.32em;white-space:nowrap;font-size:1.05em}
.tag{font-size:.76rem;font-weight:700;color:#514181}
.group-start{border-top:1px solid #aeb7cc}
.frac{display:inline-grid;vertical-align:middle;text-align:center;line-height:1.1;min-width:1.05em;font-variant-numeric:tabular-nums;font-weight:700}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em .06em}
.frac>span:last-child{padding:.06em .15em 0}
.mixed{display:inline-flex;align-items:center;gap:.18em;font-weight:700}
.answer-box{display:inline-block;vertical-align:middle;border:1px solid #657087;border-radius:3px;width:2.55em;height:1.9em}
.answer-word{width:6em}
.answer-stack{display:inline-grid;width:2.6em;grid-template-rows:1fr 1fr;height:3.2em;border:1px solid #657087;border-radius:3px}
.answer-stack>span:first-child{border-bottom:1px solid #657087}
.answer-mixed{display:inline-flex;align-items:center;gap:.35em}
.rules{font-size:.82rem;margin:0 0 9px}
.level-help{font-size:.81rem;font-weight:400;color:var(--muted);display:block;margin-top:4px}
.hint summary{font-weight:750;cursor:pointer}
.example{display:flex;align-items:center;gap:.35em;flex-wrap:wrap}
.answer-value{color:#442c8c;font-weight:750}
[hidden]{display:none!important}
@media(max-width:720px){.hero{padding:24px 17px}.workspace{grid-template-columns:1fr;padding:18px 14px 30px;gap:18px}.panel{padding:17px}.motif{gap:5px;padding-right:1px}.tile{width:40px;height:53px;font-size:1.15rem}}
@media(min-width:1080px){.questions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.sheet{padding:13px}.motif .tile:nth-child(2){display:none}.expression{font-size:1rem}.identity{gap:4px 10px}}
@page{size:A4 portrait;margin:12mm}
@media print{
  body{background:#fff;color:#000;font-size:12pt;line-height:1.25}
  header,.panel,.preview-head{display:none}
  .workspace{display:block;margin:0;padding:0;max-width:none}
  .sheet,.sheet+.sheet{margin:0;border:0;border-radius:0;box-shadow:none;padding:0}
  .sheet+.sheet{break-before:page}
  .sheet-title{font-size:18pt;margin-bottom:3mm}
  .identity{font-size:11pt;margin-bottom:3mm}
  .instructions{background:none;border:1px solid #777;margin-bottom:2mm;padding:2mm;color:#000;font-size:10pt}
  .rules{font-size:9pt;margin-bottom:3mm}
  .questions{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:7mm;grid-auto-rows:var(--row-height)}
  .sheet[data-count="8"]{--row-height:52mm;--expression-size:17pt;--box-height:10mm;--stack-height:19mm}
  .sheet[data-count="12"]{--row-height:35mm;--expression-size:16pt;--box-height:9mm;--stack-height:18mm}
  .sheet[data-count="16"]{--row-height:26mm;--expression-size:15pt;--box-height:8mm;--stack-height:16mm}
  .question{min-height:0;padding:1.5mm 0;border-color:#bbb}
  .body{gap:1mm}
  .expression{font-size:var(--expression-size);gap:1.5mm}
  .answer-box{width:13mm;height:var(--box-height)}
  .answer-word{width:37mm}
  .answer-stack{width:14mm;height:var(--stack-height)}
  .answer-mixed{gap:2mm}
  .answer-box,.answer-stack,.answer-stack>span:first-child{border-color:#555}
  .tag,.num,.answer-value{color:#000}
}
</style>
</head>
<body>
<header><div class="hero"><div><p class="eyebrow">小学4年生の算数</p><h1>分数プリント工房</h1><p>問題を選んで、自分だけの練習プリントを作ろう。</p></div><div class="motif" aria-hidden="true"><div class="tile"><span class="frac"><span>1</span><span>4</span></span></div><div class="tile"><span class="frac"><span>5</span><span>4</span></span></div></div></div></header>
<main class="workspace">
<section class="panel" aria-labelledby="settings">
<h2 id="settings">プリントの設定</h2>
<form id="options">
<label>問題の種類<select id="mode"><option value="mix">おまかせミックス</option><option value="unit">単位分数がいくつ分？</option><option value="kind">真分数・仮分数の見分け</option><option value="toMixed">仮分数 → 帯分数・整数</option><option value="toImproper">帯分数 → 仮分数</option></select></label>
<label>問題数<select id="count"><option value="8">8問</option><option value="12" selected>12問</option><option value="16">16問</option></select></label>
<label>難易度<select id="level" aria-describedby="level-help"><option value="easy">やさしい</option><option value="normal">ふつう</option><option value="challenge">チャレンジ</option></select><small class="level-help" id="level-help"></small></label>
<label>問題の並び<select id="order"><option value="grouped">種類ごと・かんたんな順</option><option value="random">ランダム</option></select></label>
<label class="check"><input type="checkbox" id="include">答えも別のページに印刷</label>
<div class="actions"><button type="submit">新しい問題を作る</button><button class="primary" type="button" id="print">A4で印刷する</button></div>
</form>
<p class="status" id="status" aria-live="polite"></p>
<details class="hint"><summary>分数のことばと例題</summary>
<p>単位分数は、分子が1の分数。真分数は分子が分母より小さく、仮分数は分子が分母と同じか、それより大きい分数です。</p>
<p>帯分数は、整数と真分数を合わせた形です。</p>
<p class="example"><span class="frac" aria-label="4分の7"><span>7</span><span>4</span></span>は「4分の7」。<span class="frac" aria-label="4分の1"><span>1</span><span>4</span></span>が7こ分です。</p>
<p>4こで1になり、3こあまるので、答えは<span class="mixed">1<span class="frac" aria-label="4分の3"><span>3</span><span>4</span></span></span>です。</p></details>
</section>
<section aria-labelledby="preview">
<div class="preview-head"><h2 id="preview">印刷プレビュー</h2><span class="badge">A4・たて</span></div>
<article class="sheet" id="problem-sheet"><h2 class="sheet-title" id="worksheet-title"></h2>
<p class="identity"><span>日づけ　　月　　日</span><span>名前　<span class="name-line">　</span></span></p>
<p class="instructions" id="directions"></p><p class="rules" id="problem-rule" hidden></p><ol class="questions" id="problems"></ol></article>
<article class="sheet" id="answer-sheet" hidden><h2 class="sheet-title" id="answers-title"></h2><p class="rules" id="marking"></p><ol class="questions" id="answers"></ol></article>
</section>
</main>
<script src="bunsu-print.js" defer></script>
</body>
</html>
