<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8fd8c7">
  <meta name="description" content="10のまとまりをおはじきで見て、ひき算を練習する子ども向けアプリ">
  <title>おはじき暗算</title>
  <style>
    :root{
      --mint:#8fd8c7;--mint-dark:#4da998;--mint-pale:#e8f8f4;
      --blue:#43b8eb;--blue-dark:#158fc8;--blue-pale:#def4fd;
      --pink:#ff72aa;--pink-dark:#dc3f83;--pink-pale:#ffe5f0;
      --yellow:#ffd967;--ink:#31413e;--muted:#6f817c;--paper:#fff;
      --shadow:0 10px 28px rgba(54,119,105,.13);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{background:#eaf8f4}
    body{margin:0;min-height:100svh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:
      radial-gradient(circle at 8% 8%,rgba(255,217,103,.32),transparent 22rem),
      radial-gradient(circle at 98% 34%,rgba(255,114,170,.16),transparent 24rem),
      linear-gradient(180deg,#f7fffd 0%,#e9f8f4 100%)}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:4px solid rgba(21,143,200,.35);outline-offset:3px}
    .app{width:min(100%,720px);min-height:100svh;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .home,.sound{border:0;background:rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(54,119,105,.10);border-radius:999px;min-height:44px;padding:0 14px;font-weight:800;text-decoration:none;display:flex;align-items:center;gap:5px}
    h1{font-size:clamp(1.35rem,6vw,1.75rem);margin:0;font-weight:900;letter-spacing:.03em;color:#357f73}
    .levels{display:grid;grid-template-columns:1fr;gap:7px;background:rgba(255,255,255,.6);padding:6px;border-radius:18px;margin-bottom:10px}
    .level{border:0;border-radius:13px;background:transparent;min-height:43px;padding:5px 3px;font-size:.84rem;font-weight:900;color:#68807a}
    .level.active{background:#fff;color:#317e72;box-shadow:0 4px 12px rgba(63,135,120,.14)}
    .card{background:rgba(255,255,255,.94);border:3px solid rgba(143,216,199,.72);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
    .topline{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;color:var(--muted);font-size:.86rem;font-weight:800}
    .stars{letter-spacing:.08em;font-size:1.15rem}.stars .off{filter:grayscale(1);opacity:.22}
    .equation{display:flex;justify-content:center;align-items:center;gap:clamp(8px,3vw,20px);padding:3px 12px 7px;font-size:clamp(2.6rem,13vw,4.6rem);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
    .equation .minus{color:var(--pink-dark)}.equation .answer{min-width:1.1em;text-align:center;color:var(--mint-dark);border-bottom:5px solid var(--mint)}
    .coach{margin:0 12px 10px;background:var(--mint-pale);border-radius:17px;padding:10px 12px;text-align:center;font-weight:900;line-height:1.45;min-height:45px}
    .coach b{color:var(--pink-dark);font-size:1.08em}
    .board{margin:0 10px 10px;padding:12px 8px 11px;border-radius:22px;background:#fbfffe;border:2px dashed #bde7dc;min-height:220px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:12px clamp(14px,7vw,46px);position:relative}
    .group{position:relative;padding-top:27px;min-width:118px}
    .group-label{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:999px;padding:3px 9px;font-size:.76rem;font-weight:900}
    .tens .group-label{color:var(--blue-dark);background:var(--blue-pale)}
    .ones .group-label{color:var(--pink-dark);background:var(--pink-pale)}
    .beads{display:grid;grid-template-columns:repeat(2,48px);grid-auto-rows:48px;gap:5px;justify-content:center;padding:8px;border-radius:21px}
    .tens .beads{border:3px solid rgba(67,184,235,.55);background:rgba(222,244,253,.45);transition:.35s ease}
    .tens.broken .beads{border-style:dashed;background:#fff;gap:8px 10px;transform:rotate(-1deg)}
    .ones .beads{border:3px solid rgba(255,114,170,.35);background:rgba(255,229,240,.45);min-height:64px}
    .bead{width:48px;height:48px;border:0;border-radius:50%;position:relative;box-shadow:inset -5px -7px 8px rgba(0,0,0,.10),inset 4px 4px 7px rgba(255,255,255,.42),0 4px 7px rgba(48,94,87,.18);transition:transform .2s,opacity .28s,filter .28s;cursor:default}
    .bead.movable{cursor:grab;touch-action:none;animation:breathe 1.25s ease-in-out infinite}.bead.movable:active{cursor:grabbing}.bead.ghost{position:fixed;z-index:999;pointer-events:none;transform:scale(1.12);opacity:.88;animation:none}
    @keyframes breathe{50%{transform:translateY(-3px);box-shadow:inset -5px -7px 8px rgba(0,0,0,.10),inset 4px 4px 7px rgba(255,255,255,.42),0 8px 12px rgba(48,94,87,.25)}}
    .bead.blue{background:linear-gradient(145deg,#5bcef6,var(--blue))}.bead.pink{background:linear-gradient(145deg,#ff8bbb,var(--pink))}
    .bead:active{transform:scale(.9)}.bead.removed{opacity:.19;filter:grayscale(.35);transform:scale(.78)}
    .bead.removed::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;color:#b12964;font-size:2.4rem;font-weight:900;opacity:1}
    .count{grid-column:1/-1;text-align:center;font-size:.78rem;font-weight:900;margin-top:2px;color:var(--muted)}
    .board.wiggle{animation:wiggle .35s ease}.card.pop{animation:pop .38s ease}
    @keyframes wiggle{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    @keyframes pop{50%{transform:scale(1.015)}}
    .actions{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;padding:0 12px 13px}
    .btn{border:0;border-radius:17px;min-height:50px;padding:8px 12px;font-weight:900;box-shadow:0 5px 0 rgba(53,126,113,.13);cursor:pointer}
    .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(53,126,113,.13)}
    .demo{background:#eef7f5;color:#4e7069}.reset{background:var(--mint);color:#184f46}
    .answer-panel{display:none;padding:0 12px 15px}.answer-panel.show{display:block;animation:rise .3s ease}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}}
    .answer-title{text-align:center;font-weight:900;margin:0 0 8px}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .choice{border:3px solid #cbece4;background:#fff;border-radius:17px;min-height:58px;font-size:1.7rem;font-weight:900;box-shadow:0 4px 0 #cbece4}
    .choice:active{transform:translateY(3px);box-shadow:0 1px 0 #cbece4}
    .success{display:none;text-align:center;padding:2px 12px 16px}.success.show{display:block;animation:rise .3s ease}
    .success-message{font-weight:900;font-size:1.2rem;color:#2d8475;margin-bottom:9px}.next{width:100%;background:var(--yellow);color:#5c4a14}
    .mini-note{text-align:center;color:#6d827d;font-size:.8rem;font-weight:700;margin:10px 8px 0;line-height:1.5}
    .step-progress{display:flex;justify-content:center;gap:6px;margin:0 0 10px}.step-dot{width:10px;height:10px;border-radius:50%;background:#d8ebe6}.step-dot.active{background:var(--mint-dark);transform:scale(1.28)}.step-dot.done{background:var(--yellow)}
    .lesson-title{text-align:center;font-size:1.15rem;font-weight:900;margin:0 12px 5px;color:#2f7065}.lesson-text{text-align:center;font-weight:800;margin:0 12px 10px;line-height:1.5;color:#526d66;min-height:24px}
    .rule-box{display:none;margin:0 14px 10px;padding:12px;border-radius:18px;background:#fff1f5;border:3px solid #ff9dc3;text-align:center;font-weight:900;color:#a82e65;line-height:1.5}.rule-box.show{display:block;animation:rise .25s ease}.rule-box .big-x{font-size:2.6rem;line-height:1;color:#e44282;vertical-align:middle;margin-right:6px}
    .mini-formula{text-align:center;font-size:clamp(1.8rem,8vw,3rem);font-weight:900;margin:0 0 10px;min-height:48px}.mini-formula .blue-text{color:var(--blue-dark)}.mini-formula .pink-text{color:var(--pink-dark)}
    .step-actions{display:grid;grid-template-columns:.72fr 1.5fr;gap:8px;padding:0 12px 15px}.step-actions .prev{background:#eef7f5;color:#58736d}.step-actions .forward{background:var(--mint);color:#174e45}.step-actions .forward.final{background:var(--yellow);color:#5c4a14}
    .kept{outline:4px solid rgba(255,217,103,.72);outline-offset:2px}.board.answer-board{background:#fffdf4;border-color:#f1d678}
    .drop-zone{flex:1 0 calc(100% - 12px);min-height:82px;border:3px dashed #a9dcd0;border-radius:18px;background:#f0faf7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;transition:.2s}.drop-zone.ready{border-color:#ff82b2;background:#fff2f7;box-shadow:inset 0 0 0 4px rgba(255,114,170,.08)}.drop-zone.answer-ready{border-color:#e7bd2b;background:#fffbed}.drop-zone.flash{transform:scale(1.02);background:#fff4bf}.drop-label{font-weight:900;color:#55736c;margin-bottom:5px}.drop-beads{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;min-height:20px}.drop-beads .bead{width:38px;height:38px}.drag-help{text-align:center;color:#bc3c73;font-weight:900;font-size:.86rem;margin:-3px 0 8px}.btn:disabled{opacity:.48;box-shadow:none;cursor:not-allowed}
    .judge-choices,.count-choices{display:none;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}.judge-choices.show,.count-choices.show{display:grid;animation:rise .25s ease}.judge-btn,.count-btn{min-height:58px;border:3px solid #bfe8de;border-radius:18px;background:#fff;font-size:1.16rem;font-weight:900;box-shadow:0 4px 0 #c5e9e1}.judge-btn.no{border-color:#ff9fc5;box-shadow:0 4px 0 #ffc5dc}.count-choices{grid-template-columns:repeat(3,1fr)}.count-btn{font-size:1.7rem}
    .correct-modal{display:none;position:absolute;inset:10px;z-index:20;background:rgba(255,255,255,.96);border:5px solid var(--yellow);border-radius:24px;place-items:center;text-align:center;padding:18px;box-shadow:0 12px 35px rgba(67,112,102,.22)}.correct-modal.show{display:grid;animation:pop .35s ease}.correct-circle{width:108px;height:108px;border:10px solid #ef5f91;border-radius:50%;display:grid;place-items:center;font-size:5rem;font-weight:900;color:#ef5f91;line-height:1}.correct-message{font-size:1.25rem;font-weight:900;color:#347c70;margin-top:10px}.correct-next{margin-top:12px;background:var(--yellow);min-width:220px}
    .burst{position:fixed;pointer-events:none;z-index:9;font-size:1.5rem;animation:burst .9s ease-out forwards}
    @keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(180deg) scale(.5);opacity:0}}
    @media(max-width:390px){.app{padding-left:8px;padding-right:8px}.board{gap:8px;min-height:208px}.group{min-width:106px}.beads{grid-template-columns:repeat(2,43px);grid-auto-rows:43px;gap:4px}.bead{width:43px;height:43px}.equation{font-size:3.05rem}.level{font-size:.77rem}.home,.sound{padding:0 10px}.home span{display:none}}
    @media(min-width:600px){.board{min-height:245px}.beads{grid-template-columns:repeat(5,52px);grid-auto-rows:52px}.bead{width:52px;height:52px}.group{min-width:285px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
  <!-- 正式版 v6：青の10から引く学習手順 -->
</head>
<body>
  <main class="app">
    <header>
      <a class="home" href="https://cetus.fun/wagaya/" aria-label="我が家アプリへ戻る">⌂ <span>わがや</span></a>
      <h1>🔵 おはじき暗算</h1>
      <button class="sound" id="soundBtn" aria-label="問題を読み上げる">🔊 よむ</button>
    </header>

    <nav class="levels" aria-label="練習内容"><div class="level active">くり下がりの ひき算</div></nav>

    <section class="card" id="gameCard">
      <div class="topline"><span id="questionNo">1もんめ / 5</span><span class="stars" id="stars" aria-label="0点"><span class="off">★</span><span class="off">★</span><span class="off">★</span><span class="off">★</span><span class="off">★</span></span></div>
      <div class="equation" aria-live="polite"><span id="a">13</span><span class="minus">−</span><span id="b">5</span><span>＝</span><span class="answer" id="answer">?</span></div>
      <div class="step-progress" id="stepProgress" aria-label="学習の進み具合"></div>
      <h2 class="lesson-title" id="lessonTitle">13から5をひくには？</h2>
      <p class="lesson-text" id="lessonText">いっしょに、じゅんばんに考えよう</p>
      <div class="mini-formula" id="miniFormula"></div>
      <div class="rule-box" id="ruleBox"><span class="big-x">×</span><span id="ruleText"></span></div>

      <div class="board" id="board">
        <div class="correct-modal" id="correctModal"><div>
          <div class="correct-circle">〇</div>
          <div class="correct-message" id="correctMessage">せいかい！</div>
          <button class="btn correct-next" id="correctNext">つぎへ →</button>
        </div></div>
        <div class="group tens" id="tensGroup">
          <span class="group-label" id="tensLabel">10のまとまり</span>
          <div class="beads" id="tensBeads"></div>
        </div>
        <div class="group ones" id="onesGroup">
          <span class="group-label">1のばら</span>
          <div class="beads" id="onesBeads"></div>
        </div>
        <div class="drop-zone" id="dropZone">
          <div class="drop-label" id="dropLabel">ここに うごかす</div>
          <div class="drop-beads" id="dropBeads"></div>
        </div>
      </div>
      <div class="drag-help" id="dragHelp">おはじきを指で動かしてね</div>

      <div class="judge-choices" id="judgeChoices">
        <button class="judge-btn" id="canBtn">ひける</button>
        <button class="judge-btn no" id="cannotBtn">ひけない</button>
      </div>
      <div class="count-choices" id="countChoices"></div>

      <div class="step-actions">
        <button class="btn prev" id="prevBtn">↻ さいしょから</button>
        <button class="btn forward" id="nextStepBtn">つぎへ →</button>
      </div>
    </section>
    <p class="mini-note">くり下がるときは、ピンクを消さずに青の10からひくよ。<br>まちがえても、何回でもやりなおせます。</p>
  </main>
  <script>
  (()=>{
    const $=id=>document.getElementById(id);
    const el={a:$('a'),b:$('b'),ans:$('answer'),title:$('lessonTitle'),text:$('lessonText'),formula:$('miniFormula'),rule:$('ruleBox'),ruleText:$('ruleText'),board:$('board'),blue:$('tensBeads'),pink:$('onesBeads'),blueGroup:$('tensGroup'),pinkGroup:$('onesGroup'),blueLabel:$('tensLabel'),pinkLabel:document.querySelector('#onesGroup .group-label'),drop:$('dropZone'),help:$('dragHelp'),judge:$('judgeChoices'),count:$('countChoices'),next:$('nextStepBtn'),prev:$('prevBtn'),modal:$('correctModal'),modalText:$('correctMessage'),modalNext:$('correctNext'),progress:$('stepProgress'),questionNo:$('questionNo'),stars:$('stars')};
    let q={a:13,b:5},stage='intro',removed=new Set(),round=1,score=0,modalAction=null;
    const one=()=>q.a%10,answer=()=>q.a-q.b;
    const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
    function newQuestion(first=false){if(first){q={a:13,b:5}}else{const a=rand(11,18),o=a%10;q={a,b:rand(o+1,9)}}stage='intro';removed.clear()}

    function dotProgress(){const stages=['intro','compare','split','subtract','count'];const current=stage==='done'?'count':stage;const pos=Math.max(0,stages.indexOf(current));el.progress.innerHTML=stages.map((_,i)=>`<span class="step-dot ${i<pos?'done':i===pos?'active':''}"></span>`).join('')}
    function bead(color,i,clickable=false){const x=document.createElement('button');x.type='button';x.className=`bead ${color}${removed.has(i)?' removed':''}`;x.setAttribute('aria-label',(color==='blue'?'青':'ピンク')+'のおはじき');if(clickable)x.addEventListener('click',()=>removeBlue(i));else x.disabled=true;return x}
    function fill(parent,color,n,clickable=false){parent.innerHTML='';for(let i=0;i<n;i++)parent.appendChild(bead(color,i,clickable));const c=document.createElement('div');c.className='count';c.textContent=n+'こ';parent.appendChild(c)}
    function showRule(show,text=''){el.rule.classList.toggle('show',show);el.ruleText.innerHTML=text}

    function render(){
      el.a.textContent=q.a;el.b.textContent=q.b;el.ans.textContent=stage==='done'?answer():'?';
      el.questionNo.textContent=round+'もんめ / 5';el.stars.innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<score?'':'off'}">★</span>`).join('');dotProgress();
      el.modal.classList.remove('show');el.judge.classList.remove('show');el.count.classList.remove('show');showRule(false);
      el.drop.style.display='none';el.help.style.display='none';el.blueGroup.style.display='none';el.pinkGroup.style.display='none';
      el.board.style.display=stage==='intro'?'none':'flex';el.next.style.display='block';el.next.disabled=false;el.prev.disabled=stage==='intro';el.next.classList.remove('final');

      if(stage==='intro'){
        el.title.textContent=`${q.a}から${q.b}をひくには？`;el.text.textContent='まず、1のくらいを見てみよう';el.formula.innerHTML='';el.next.textContent='1のくらいを 見る →';
      }
      if(stage==='compare'){
        el.title.textContent=`${one()} − ${q.b} は できる？`;el.text.textContent=`青${one()}こと ピンク${q.b}こを くらべよう`;el.formula.innerHTML=`<span class="blue-text">${one()}</span> − <span class="pink-text">${q.b}</span>`;
        el.blueGroup.style.display='block';el.pinkGroup.style.display='block';el.blueLabel.textContent=`青 ${one()}こ`;el.pinkLabel.textContent=`ピンク ${q.b}こ`;fill(el.blue,'blue',one());fill(el.pink,'pink',q.b);el.judge.classList.add('show');el.next.style.display='none';
      }
      if(stage==='split'){
        el.title.textContent=`${q.a}を 10と${one()}に わけよう`;el.text.textContent='青が10のまとまり、ピンクが1のばらだよ';el.formula.innerHTML=`${q.a} ＝ <span class="blue-text">10</span> ＋ <span class="pink-text">${one()}</span>`;
        el.blueGroup.style.display='block';el.pinkGroup.style.display='block';el.blueLabel.textContent='青 10こ';el.pinkLabel.textContent=`ピンク ${one()}こ`;fill(el.blue,'blue',10);fill(el.pink,'pink',one());el.next.textContent='青の10から ひく →';
      }
      if(stage==='subtract'){
        const left=q.b-removed.size;el.title.textContent=`青の10から ${q.b}こ けそう`;el.text.textContent=left?`ピンクからは消せません。青をあと${left}こクリック！`:'ぴったり消せたね！';el.formula.innerHTML=`<span class="blue-text">10</span> − ${q.b}`;
        el.blueGroup.style.display='block';el.pinkGroup.style.display='block';el.blueLabel.textContent='青 10こ';el.pinkLabel.textContent=`ピンク ${one()}こ`;fill(el.blue,'blue',10,true);fill(el.pink,'pink',one());el.help.style.display='block';el.help.textContent='消すのは青だけ！ 青いおはじきをクリックしてね';el.next.style.display='none';
      }
      if(stage==='count'||stage==='done'){
        const blueLeft=10-q.b;el.title.textContent='青とピンクを 数えよう';el.text.textContent=`青${blueLeft}こと ピンク${one()}こ。ぜんぶで いくつ？`;el.formula.innerHTML=`<span class="blue-text">${blueLeft}</span> ＋ <span class="pink-text">${one()}</span>${stage==='done'?` ＝ ${answer()}`:''}`;
        el.blueGroup.style.display='block';el.pinkGroup.style.display='block';el.blueLabel.textContent=`青 ${blueLeft}こ`;el.pinkLabel.textContent=`ピンク ${one()}こ`;removed.clear();fill(el.blue,'blue',blueLeft);fill(el.pink,'pink',one());
        if(stage==='count'){renderCountChoices();el.count.classList.add('show');el.next.style.display='none'}
        else{el.next.textContent=round===5?'もう5もん やる':'つぎの もんだい →';el.next.classList.add('final')}
      }
    }

    function next(){if(stage==='intro')stage='compare';else if(stage==='split')stage='subtract';else if(stage==='done'){if(round===5){round=1;score=0}else round++;newQuestion()}render()}
    function chooseCan(){showRule(true,`<b>ブブー！</b><br>${one()}こしかないから、${q.b}こは ひけないよ`);el.board.classList.add('wiggle');setTimeout(()=>el.board.classList.remove('wiggle'),350)}
    function chooseCannot(){openCorrect(`そう！ ${one()} − ${q.b} は できない`,()=>{stage='split';render()})}
    function removeBlue(i){if(stage!=='subtract'||removed.has(i))return;removed.add(i);render();if(removed.size===q.b)openCorrect(`青を${q.b}こ、ぴったり消せた！`,()=>{stage='count';render()})}
    function openCorrect(message,action){modalAction=action;el.modalText.textContent=message;el.modal.classList.add('show');playCorrectChime()}
    function renderCountChoices(){const a=answer(),set=new Set([a]);while(set.size<3)set.add(Math.max(0,a+rand(-3,3)));el.count.innerHTML='';[...set].sort(()=>Math.random()-.5).forEach(n=>{const b=document.createElement('button');b.className='count-btn';b.textContent=n;b.onclick=()=>chooseCount(n,b);el.count.appendChild(b)})}
    function chooseCount(n,button){if(n!==answer()){button.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:300});el.text.textContent='おしい！ 青とピンクをもう一度数えてね';return}score++;stage='done';render();openCorrect(`${10-q.b} ＋ ${one()} ＝ ${answer()}！`,()=>{el.modal.classList.remove('show');render();celebrate()})}
    function restart(){stage='intro';removed.clear();render()}
    function celebrate(){for(let i=0;i<16;i++){const s=document.createElement('span');s.className='burst';s.textContent=['★','●','◆','♥'][i%4];s.style.left=(45+Math.random()*10)+'vw';s.style.top=(45+Math.random()*8)+'vh';s.style.color=['#43b8eb','#ff72aa','#ffd967','#8fd8c7'][i%4];s.style.setProperty('--x',(Math.random()*260-130)+'px');s.style.setProperty('--y',(Math.random()*-220-20)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
    function playCorrectChime(){
      const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;
      const ctx=new AudioCtx();const now=ctx.currentTime;
      [[659.25,0,.16],[987.77,.18,.42]].forEach(([freq,start,end])=>{
        const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;
        gain.gain.setValueAtTime(.0001,now+start);gain.gain.exponentialRampToValueAtTime(.28,now+start+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+end);
        osc.connect(gain);gain.connect(ctx.destination);osc.start(now+start);osc.stop(now+end);
      });
      setTimeout(()=>ctx.close(),650);
    }
    function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text||`${q.a}ひく${q.b}は、いくつ？`);u.lang='ja-JP';u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u)}
    el.next.onclick=next;el.prev.onclick=restart;el.canBtn=$('canBtn');el.cannotBtn=$('cannotBtn');el.canBtn.onclick=chooseCan;el.cannotBtn.onclick=chooseCannot;el.modalNext.onclick=()=>{const fn=modalAction;modalAction=null;fn?.()};$('soundBtn').onclick=()=>speak();
    newQuestion(true);render();
  })();
  </script>
