<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cetus.fun</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#292733;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{max-width:1080px;margin:auto;padding:38px 18px 18px}.brand{font-size:28px;font-weight:800}.sub{font-size:13px;color:#999;margin-top:5px}.filters{max-width:1080px;margin:auto;padding:4px 18px 20px;display:flex;gap:8px;overflow:auto}.filters button{border:0;border-radius:99px;padding:9px 14px;background:#ece9e4;color:#666;font-weight:650;white-space:nowrap}.filters .on{background:#292733;color:white}main{max-width:1080px;margin:auto;padding:0 12px 60px}.gallery{columns:2;column-gap:10px}.card{break-inside:avoid;margin:0 0 10px;background:white;border-radius:17px;overflow:hidden;box-shadow:0 2px 14px #0000000c}.pic{min-height:160px;display:flex;align-items:center;justify-content:center;font-size:55px;background:linear-gradient(145deg,#e6f2ff,#f3eaff)}.game{min-height:220px;background:linear-gradient(145deg,#dfeee1,#fff0d4)}.art{min-height:190px;background:linear-gradient(145deg,#ffe6ed,#fff3ce)}.txt{padding:12px 13px 14px}.title{font-size:14px;font-weight:750}.note{font-size:12px;color:#888;line-height:1.5;margin-top:4px}.tag{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:8px;background:#f1efec;color:#777;font-size:10px}@media(min-width:650px){.gallery{columns:3;column-gap:14px}.card{margin-bottom:14px}}@media(min-width:950px){.gallery{columns:4}}
</style></head><body><header><div class="brand">cetus.fun</div><div class="sub">好きなもの、つくったもの。</div></header>
<div class="filters"><button class="on" data-filter="all">すべて</button><button data-filter="game">GAME</button><button data-filter="app">APP</button><button data-filter="art">IMAGE</button></div>
<main><div class="gallery">
<article class="card" data-kind="game"><div class="pic game">🌱</div><div class="txt"><div class="title">ゲームの記録</div><div class="note">好きな場面やスクショをここへ。</div><span class="tag">GAME</span></div></article>
<article class="card" data-kind="app"><div class="pic">🧩</div><div class="txt"><div class="title">つくったもの</div><div class="note">アプリや画面の記録。</div><span class="tag">APP</span></div></article>
<article class="card" data-kind="art"><div class="pic art">✨</div><div class="txt"><div class="title">お気に入り</div><div class="note">残しておきたい画像をポンポン。</div><span class="tag">IMAGE</span></div></article>
<article class="card" data-kind="game"><div class="pic game">🎮</div><div class="txt"><div class="title">PLAY LOG</div><span class="tag">GAME</span></div></article>
</div></main><script>
document.querySelectorAll('button[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.card').forEach(c=>c.style.display=b.dataset.filter==='all'||c.dataset.kind===b.dataset.filter?'':'none')});
</script></body></html>
