<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf6f1"><title>外食料金｜我が家</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body>
<header><a href="/">‹ 我が家HOME</a><strong>🍽️ 外食料金</strong></header><main><div class="heading"><div><small>みんなで、いくら？</small><h1>外食料金</h1></div><button id="new-store" hidden>＋ 店舗追加</button></div><p id="status" role="status">料金を読み込んでいます…</p><div id="household-row" hidden><label for="household">家庭</label><select id="household"></select></div>
<section id="store-list"><h2>店舗を選ぶ</h2><div id="stores" class="stores"></div><p id="no-stores" hidden>「店舗追加」から登録してください。</p></section>
<section id="simulator" hidden><button class="text" id="return-list">‹ 店舗一覧へ</button><div class="heading"><h2 id="store-name"></h2><button id="edit-store" hidden>編集</button></div><p id="store-note"></p><div class="panel"><div class="heading"><h2>人数</h2><strong id="people">合計 0人</strong></div><div id="counts"></div><button class="text" id="reset-counts">人数をすべて0にする</button></div><div class="heading"><h2>コースごとの合計</h2><small class="badge">税込</small></div><div id="totals" class="totals" aria-live="polite"></div><p id="no-courses" hidden>「編集」からコースを登録してください。</p><section id="comparison" class="panel"><h2>コースを比べる</h2><div class="compare"><select id="compare-from" aria-label="基準のコース"></select><span>と</span><select id="compare-to" aria-label="比較するコース"></select></div><p id="difference" aria-live="polite"></p></section><details class="panel"><summary>1人あたりの税込料金</summary><div id="unit-prices"></div></details></section></main>
<dialog id="editor"><form id="store-form"><div class="heading"><h2 id="edit-heading">店舗編集</h2><button type="button" id="close-editor" aria-label="閉じる">×</button></div><label>店舗名<input id="input-name" required maxlength="100"></label><label>メモ・料金の出典<textarea id="input-note" maxlength="1000" rows="3"></textarea></label><div class="heading"><h3>コースと税込料金</h3><button type="button" id="add-course">＋ コース</button></div><div id="course-editor"></div><p id="editor-status" role="status"></p><div class="actions"><button type="button" id="delete-store" class="danger">店舗を削除</button><button type="submit" id="save-store" class="primary">保存する</button></div></form></dialog></body></html>
