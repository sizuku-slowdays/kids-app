<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eff5f1"><meta name="referrer" content="no-referrer"><title>通帳表示・印刷 · 我が家</title><link rel="icon" href="../../../home-icon-192.png"><link rel="stylesheet" href="book.css"><script type="module" src="book.js"></script></head><body><main class="screen" id="screen"><header><a href="./">← つうちょうへ</a><p class="eyebrow">WAGAYA BANK</p><h1>わたしの通帳</h1><p>お金のうごきを、ひとつずつ。</p></header><section class="controls"><form id="filters"><label>表示する帳面<select id="account" required></select></label><label>表示・印刷する期間<select id="mode"><option value="all">全履歴</option><option value="month">指定した年月</option><option value="range">開始日〜終了日</option></select></label><label id="month-field" hidden>年月<input type="month" id="month"></label><div id="range-fields" hidden><label>開始日<input type="date" id="from"></label><label>終了日<input type="date" id="to"></label></div><button type="submit">通帳を表示・更新</button></form><button type="button" id="print" disabled>通帳を印刷する / PDF保存</button><p id="status" role="status" aria-live="polite"></p><details><summary>A4二つ折りの印刷方法</summary><ol><li>A4・横向き・倍率100％を選び、ブラウザのヘッダーとフッターをOFFにします。</li><li>片面印刷でOK。1枚目は表紙、2枚目以降は履歴です。</li><li>表紙は印刷面を外に、本文は印刷面を内にして中央で二つ折りします。</li><li>本文を用紙番号順に重ね、表紙ではさんで保管します。本文用紙を1枚ずつ開いて読む差し込み式です。</li></ol><p>「冊子印刷」や「1枚に複数ページ」は選ばず、そのまま印刷してください。PDF保存も同じボタンからできます。</p></details></section><section id="summary" class="summary" hidden></section><aside id="warnings" hidden></aside><section id="transactions" hidden><h2 id="book-title"></h2><p class="table-hint">表は横に動かして確認できます。</p><div class="table-scroll" tabindex="0" aria-label="通帳の取引一覧"><table id="ledger"></table></div></section></main><section id="print-area" aria-label="印刷する通帳"></section></body></html>
