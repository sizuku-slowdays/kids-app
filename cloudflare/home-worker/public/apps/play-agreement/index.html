<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <title>遊ぶやくそく｜HOME</title>
  <link rel="stylesheet" href="/apps/play-agreement/style.css" />
</head>
<body>
  <main>
    <p class="eyebrow">MY HOME</p>
    <h1>遊ぶやくそく</h1>
    <section class="panel" id="panel">
      <p id="status">管理画面をひらいています…</p>
      <form id="setup" hidden>
        <h2>この端末をつなぐ</h2>
        <p>最初の1回だけ、管理用の接続キーを入力します。友だちには見せないでください。</p>
        <label for="token">管理用の接続キー</label>
        <input id="token" name="token" type="password" autocomplete="off" inputmode="text" required />
        <button type="submit">この端末をつなぐ</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>
    <p><a href="/">HOMEへ戻る</a></p>
  </main>
  <script type="module" src="/apps/play-agreement/app.js"></script>
</body>
</html>
