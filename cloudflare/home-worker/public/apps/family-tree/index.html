<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家系図｜我が家</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body>
<header><a href="/">⌂ HOME</a><h1>家系図</h1><select id="household" aria-label="家庭"></select></header>
<main><p id="status" role="status">読み込み中…</p><div class="toolbar"><label>中心の人<select id="center"></select></label><label>表示範囲<select id="range"><option value="2">近い親せき</option><option value="4">少し広く</option><option value="all">全員</option></select></label><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-in" aria-label="拡大">＋</button><button id="reset">中央に戻す</button></div>
<p class="help">写真や名前を押すと、人物の情報を見られます。指2本で拡大・縮小できます。</p><div id="viewport"><div id="stage"><svg id="lines" aria-hidden="true"></svg><div id="nodes"></div></div></div><p id="empty" hidden>まだ人物が登録されていません。大人の画面から人物と関係を追加してください。</p>
<div class="toolbar adult" hidden><button id="add-person">人物を追加</button><button id="add-relation">関係を追加</button><button id="trash">ごみ箱</button><button id="backup">バックアップ</button><label class="button">復元<input id="restore-file" type="file" accept="application/json" hidden></label></div><details id="settings" hidden><summary>家族の区分・表示名を設定</summary><p>「大人」を設定すると家系図を編集できます。「未設定」は閲覧のみです。</p><div id="member-settings"></div></details><section id="relations-panel" class="adult" hidden><h2>登録した関係</h2><div id="relations-list"></div></section></main>
<dialog id="person-dialog"><form id="person-form"><h2 id="person-heading">人物</h2><input name="id" type="hidden"><label>名前<input name="name" maxlength="100"></label><label>ふりがな<input name="furigana" maxlength="100"></label><label>旧姓<input name="former_name" maxlength="100"></label><label>続柄に使う区分<select name="gender"><option value="unknown">未設定</option><option value="female">女性</option><option value="male">男性</option><option value="other">その他</option></select></label><label>HOMEの本人<select name="home_user_id"></select></label><label>生年月日<input name="birth_date" placeholder="例：2016-04-01（年だけでも可）"></label><label>命日<input name="death_date" placeholder="不明なら空欄"></label><label>思い出・メモ<textarea name="memo" maxlength="10000" rows="4"></textarea></label><input name="photo_id" type="hidden"><label id="photo-label">顔写真<input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="remove-photo" type="button">写真を外す</button><div class="actions"><button type="button" data-close>閉じる</button><button id="delete-person" type="button">削除</button><button id="save-person" type="submit">保存</button></div></form></dialog>
<dialog id="relation-dialog"><form id="relation-form"><h2>関係</h2><input name="id" type="hidden"><label>1人目<select name="from_person"></select></label><label>関係<select name="kind"><option value="biological_parent">親 → 子（血縁）</option><option value="adoptive_parent">親 → 子（養子）</option><option value="guardian">育てる人 → 子</option><option value="marriage">婚姻</option><option value="partnership">パートナー</option><option value="sibling">きょうだい</option></select></label><label>2人目<select name="to_person"></select></label><label>状態<select name="status"><option value="current">現在</option><option value="divorced">離婚</option><option value="ended">終了</option><option value="unknown">不明</option></select></label><label>開始日<input name="start_date" placeholder="不明なら空欄"></label><label>終了日<input name="end_date" placeholder="不明なら空欄"></label><label>メモ<textarea name="memo" maxlength="10000"></textarea></label><div class="actions"><button type="button" data-close>閉じる</button><button id="delete-relation" type="button">削除</button><button type="submit">保存</button></div></form></dialog>
<dialog id="trash-dialog"><h2>ごみ箱</h2><div id="trash-list"></div><button data-close>閉じる</button></dialog></body></html>
