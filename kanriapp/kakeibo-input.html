<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>予算・積み立て</title>
  <link rel="apple-touch-icon" href="img/kakeibo.png">
  <link rel="icon" type="image/png" href="img/kakeibo.png">
  <meta name="theme-color" content="#fff3c4">
  <style>
    :root{--bg:#fff8e7;--main:#ffb84d;--safe:#2e9f62;--danger:#e63946;--text:#333;
      --muted:#777;--line:#eadfc9;--shadow:0 8px 20px rgba(130,90,30,.12);--radius:18px}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#fff2bf 0%,var(--bg) 220px);color:var(--text);line-height:1.6;padding-bottom:100px}
    header{padding:16px;display:flex;align-items:center;gap:12px}
    header h1{font-size:1.35rem;margin:0}
    .back{border:1px solid #ebd19a;border-radius:999px;background:#fff3d1;color:#5b3a05;
      padding:8px 14px;font-weight:800;text-decoration:none}
    main{width:min(620px,100%);margin:auto;padding:0 14px}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:17px;margin-bottom:14px}
    h2{font-size:1.05rem;margin:0 0 12px}
    .hint{font-size:.8rem;color:var(--muted);margin:5px 0 12px}
    label.field{display:block;font-size:.86rem;font-weight:800;color:var(--muted);margin-bottom:5px}
    input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;
      font-size:1rem;background:#fffdf8;color:var(--text)}
    .money{display:flex;align-items:center;gap:8px}.money input{flex:1}.money span{font-weight:800}
    .budget-row,.fund-card{border:1px solid var(--line);background:#fff9ed;border-radius:13px;padding:11px;margin-bottom:9px}
    .budget-grid{display:grid;grid-template-columns:1fr 130px 36px;gap:7px;align-items:center}
    .remove{width:36px;height:40px;border:none;border-radius:10px;background:#fff1f2;color:#a4161a;font-weight:900}
    button{border:none;border-radius:999px;padding:10px 15px;font-size:.9rem;font-weight:900;
      background:var(--main);color:#3e2600;cursor:pointer}
    .secondary{background:#fff3d1;border:1px solid #ebd19a}
    .fund-head{display:flex;justify-content:space-between;align-items:start;gap:8px}
    .fund-name{font-weight:900}.fund-balance{font-size:1.12rem;font-weight:900;color:var(--safe)}
    .fund-meta{font-size:.8rem;color:var(--muted)}
    .fund-action{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
    .fund-action input{font-size:.9rem;padding:8px}
    .fund-action button{padding:8px;font-size:.8rem}
    .withdraw{background:#fff1f2;color:#a4161a;border:1px solid #f4a7af}
    .history{font-size:.78rem;color:var(--muted);margin-top:8px}
    .recurring-form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
    .recurring-form .wide{grid-column:1/-1}
    .recurring-item{border:1px solid var(--line);background:#fff9ed;border-radius:13px;padding:11px;margin-bottom:9px}
    .recurring-head{display:flex;justify-content:space-between;gap:8px;font-weight:900}
    .recurring-actions{display:flex;gap:7px;margin-top:8px}
    .recurring-actions button{padding:7px 12px;font-size:.8rem}
    .total-box{background:#f0fff7;border:1px solid #c6ead6;border-radius:12px;padding:12px;
      display:flex;justify-content:space-between;font-weight:900;margin-bottom:10px}
    .save-area{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 20px;
      background:linear-gradient(to top,var(--bg) 75%,transparent);z-index:10}
    .save{display:block;width:min(580px,100%);margin:auto;padding:15px;font-size:1.05rem;
      background:linear-gradient(135deg,#ffb84d,#ff8c00)}
    .toast{display:none;position:fixed;top:18px;left:50%;transform:translateX(-50%);
      background:var(--safe);color:white;padding:11px 20px;border-radius:999px;font-weight:900;z-index:20}
    @media(max-width:420px){.budget-grid{grid-template-columns:1fr 105px 34px}.fund-action{grid-template-columns:1fr 1fr}.fund-action input{grid-column:1/-1}.recurring-form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><a class="back" href="kakeibo-app.html">← 戻る</a><h1>🎯 予算・積み立て</h1></header>
  <main>
    <section class="card">
      <h2>🌸 楽天PINKの月目標</h2>
      <p class="hint">超えてからではなく、今のペースで超えそうな時点から家計簿画面で知らせます。</p>
      <label class="field" for="pinkGoal">毎月の利用上限</label>
      <div class="money"><input id="pinkGoal" type="number" inputmode="numeric" min="0" step="1000"><span>円</span></div>
    </section>

    <section class="card">
      <h2>🍪 カテゴリ別の月予算</h2>
      <p class="hint">管理したい項目だけでOK。使わなかった分は月末にリセットします。</p>
      <div id="budgetRows"></div>
      <button type="button" class="secondary" id="addBudget">＋ 予算項目を追加</button>
    </section>

    <section class="card" id="recurring">
      <h2>🔁 毎月の定期入力</h2>
      <p class="hint">指定日を過ぎて家計簿を開くと自動計上します。31日は短い月のみ月末扱いです。</p>
      <div class="recurring-form">
        <select id="recType" aria-label="収入または支出"><option value="expense">支出</option><option value="income">収入</option></select>
        <input id="recMemo" class="wide" type="text" placeholder="名前（例：国保）">
        <input id="recAmount" type="number" inputmode="numeric" min="1" step="1" placeholder="金額">
        <input id="recDay" type="number" inputmode="numeric" min="1" max="31" placeholder="毎月の日付">
        <select id="recPayment" aria-label="口座">
          <option>楽天PINK</option><option>楽天VISA</option><option>現金</option><option>auじぶん銀行</option>
          <option>ゆうちょ銀行</option><option>福岡中央銀行</option><option>福岡銀行</option>
        </select>
        <select id="recCategory" aria-label="カテゴリ"></select>
        <input id="recStartMonth" type="month" class="wide" aria-label="開始月">
        <button type="button" class="wide" id="saveRecurring">＋ 定期入力を登録</button>
      </div>
      <div id="recurringList"></div>
    </section>

    <section class="card" id="funds">
      <h2>🌱 目的別積み立て</h2>
      <p class="hint">「確保」で残高が増え、「使用」で減ります。月をまたいでも残高は残ります。</p>
      <div class="total-box"><span>積み立て合計</span><span id="fundTotal">0円</span></div>
      <div id="fundList"></div>
      <button type="button" class="secondary" id="addFund">＋ 積み立て先を追加</button>
    </section>
  </main>
  <div class="toast" id="toast">保存しました</div>
  <div class="save-area"><button type="button" class="save" id="saveBtn">設定を保存する</button></div>

  <script>
    const STORAGE_KEY="kakeibo-app-stable-v3";
    const PLAN_KEY="kakeibo-plan-v1";
    const SETTINGS_KEY="kakeibo-cloud-settings-v1";
    const APP_KEY="kakeibo-app";
    const APP_VERSION=4;
    const DEFAULT_API="https://api.cetus.fun/api/app-data";
    const CATEGORIES=["おやつ","食費","日用品","医療費","子ども","学校","習い事","ゲーム・娯楽","美容","犬","交通・ガソリン","外食","固定費","特別費"];
    let plan;
    let editingRecurringId=null;
    const $=id=>document.getElementById(id);
    const yen=v=>Number(v||0).toLocaleString("ja-JP")+"円";
    const makeId=()=>crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(36).slice(2);
    const pad=n=>String(n).padStart(2,"0");
    const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
    const localMonth=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)};

    function normalizePlan(raw){
      const p=raw&&typeof raw==="object"?raw:{};
      return {version:1,pinkGoal:Math.max(0,Number(p.pinkGoal??50000)),
        categoryBudgets:p.categoryBudgets&&typeof p.categoryBudgets==="object"?p.categoryBudgets:{"おやつ":4000},
        funds:Array.isArray(p.funds)?p.funds:[],fundTransactions:Array.isArray(p.fundTransactions)?p.fundTransactions:[],
        recurringRules:Array.isArray(p.recurringRules)?p.recurringRules:[]};
    }
    function load(){
      try{plan=normalizePlan(JSON.parse(localStorage.getItem(PLAN_KEY)||"null"))}
      catch(e){plan=normalizePlan(null)}
    }
    function categoryOptions(selected){
      const all=CATEGORIES.includes(selected)?CATEGORIES:[...CATEGORIES,selected];
      return all.map(c=>`<option value="${c}"${c===selected?" selected":""}>${c}</option>`).join("");
    }
    function addBudgetRow(name="おやつ",amount=""){
      const row=document.createElement("div");row.className="budget-row";
      row.innerHTML=`<div class="budget-grid"><select aria-label="予算カテゴリ">${categoryOptions(name)}</select>
        <input type="number" inputmode="numeric" min="0" step="100" placeholder="月予算" value="${amount||""}" aria-label="月予算">
        <button type="button" class="remove" aria-label="削除">×</button></div>`;
      row.querySelector(".remove").onclick=()=>row.remove();
      $("budgetRows").appendChild(row);
    }
    function fundBalance(id){
      return plan.fundTransactions.filter(t=>t.fundId===id).reduce((s,t)=>s+(t.type==="withdraw"?-1:1)*Number(t.amount||0),0);
    }
    function renderFunds(){
      const area=$("fundList");
      if(!plan.funds.length){area.innerHTML='<p class="hint">まだ積み立て先がありません。</p>'}
      else area.innerHTML=plan.funds.map(f=>{
        const recent=plan.fundTransactions.filter(t=>t.fundId===f.id).slice(-3).reverse();
        return `<div class="fund-card" data-id="${f.id}">
          <div class="fund-head"><div><div class="fund-name">${escapeHtml(f.name)}</div>
          <div class="fund-meta">毎月の目安 ${yen(f.monthlyTarget)}</div></div>
          <div class="fund-balance">${yen(fundBalance(f.id))}</div></div>
          <div class="fund-action"><input type="number" inputmode="numeric" min="0" step="100" placeholder="金額">
          <button type="button" data-action="deposit">＋ 確保</button>
          <button type="button" class="withdraw" data-action="withdraw">− 使用</button></div>
          <div class="history">${recent.map(t=>`${t.date}　${t.type==="withdraw"?"使用":"確保"} ${yen(t.amount)}`).join("<br>")}</div>
          <button type="button" class="remove-fund secondary" style="margin-top:9px;padding:6px 11px">積み立て先を削除</button>
        </div>`;
      }).join("");
      area.querySelectorAll("[data-action]").forEach(btn=>btn.onclick=()=>fundAction(btn));
      area.querySelectorAll(".remove-fund").forEach(btn=>btn.onclick=()=>removeFund(btn.closest(".fund-card").dataset.id));
      $("fundTotal").textContent=yen(plan.funds.reduce((s,f)=>s+fundBalance(f.id),0));
    }
    function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
    function fundAction(btn){
      const card=btn.closest(".fund-card"),amount=Number(card.querySelector("input").value||0);
      if(amount<=0){alert("金額を入力してください。");return}
      const type=btn.dataset.action;
      if(type==="withdraw"&&amount>fundBalance(card.dataset.id)){if(!confirm("現在残高を超えますが、このまま記録しますか？"))return}
      plan.fundTransactions.push({id:makeId(),fundId:card.dataset.id,type,amount,date:today(),createdAt:new Date().toISOString()});
      saveLocal();renderFunds();saveCloud();
    }
    function removeFund(id){
      const f=plan.funds.find(x=>x.id===id);
      if(!confirm(`「${f?.name||"積み立て先"}」と履歴を削除しますか？`))return;
      plan.funds=plan.funds.filter(x=>x.id!==id);
      plan.fundTransactions=plan.fundTransactions.filter(t=>t.fundId!==id);
      saveLocal();renderFunds();
    }
    function addFund(){
      const name=prompt("積み立て先の名前（例：犬関係）");
      if(!name||!name.trim())return;
      const target=Number(prompt("毎月いくら積み立てる目安にしますか？","1000")||0);
      plan.funds.push({id:makeId(),name:name.trim(),monthlyTarget:Math.max(0,target),createdAt:new Date().toISOString()});
      saveLocal();renderFunds();
    }
    function resetRecurringForm(){
      editingRecurringId=null;
      $("recType").value="expense";$("recMemo").value="";$("recAmount").value="";$("recDay").value="";
      $("recPayment").value="福岡中央銀行";$("recCategory").value="固定費";
      $("recStartMonth").value=localMonth();
      $("saveRecurring").textContent="＋ 定期入力を登録";
    }
    function renderRecurring(){
      const area=$("recurringList"),rules=plan.recurringRules||[];
      if(!rules.length){area.innerHTML='<p class="hint">定期入力はまだありません。</p>';return}
      area.innerHTML=rules.map(r=>`<div class="recurring-item" data-id="${r.id}">
        <div class="recurring-head"><span>${escapeHtml(r.memo||"定期入力")}</span><span>${yen(r.amount)}</span></div>
        <div class="fund-meta">毎月${Number(r.day)}日・${escapeHtml(r.payment)}・${escapeHtml(r.category)}・${r.type==="income"?"収入":"支出"}</div>
        <div class="recurring-actions"><button type="button" class="secondary edit-recurring">変更</button>
        <button type="button" class="withdraw delete-recurring">削除</button></div></div>`).join("");
      area.querySelectorAll(".edit-recurring").forEach(b=>b.onclick=()=>editRecurring(b.closest(".recurring-item").dataset.id));
      area.querySelectorAll(".delete-recurring").forEach(b=>b.onclick=()=>deleteRecurring(b.closest(".recurring-item").dataset.id));
    }
    function editRecurring(id){
      const r=plan.recurringRules.find(x=>x.id===id);if(!r)return;
      editingRecurringId=id;$("recType").value=r.type;$("recMemo").value=r.memo;$("recAmount").value=r.amount;
      $("recDay").value=r.day;$("recPayment").value=r.payment;$("recCategory").value=r.category;
      $("recStartMonth").value=r.startMonth;$("saveRecurring").textContent="変更を保存";
      document.getElementById("recurring").scrollIntoView({behavior:"smooth"});
    }
    function deleteRecurring(id){
      const r=plan.recurringRules.find(x=>x.id===id);
      if(!confirm(`「${r?.memo||"定期入力"}」を削除しますか？\n過去に計上済みの履歴は残ります。`))return;
      plan.recurringRules=plan.recurringRules.filter(x=>x.id!==id);saveLocal();renderRecurring();saveCloud();
      if(editingRecurringId===id)resetRecurringForm();
    }
    function saveRecurringRule(){
      const memo=$("recMemo").value.trim(),amount=Number($("recAmount").value),day=Number($("recDay").value);
      if(!memo){alert("定期入力の名前を入力してください。");return}
      if(amount<=0){alert("金額を入力してください。");return}
      if(day<1||day>31){alert("日付は1〜31で入力してください。");return}
      const rule={id:editingRecurringId||makeId(),type:$("recType").value,memo,amount,day,
        payment:$("recPayment").value,category:$("recCategory").value,startMonth:$("recStartMonth").value||localMonth(),active:true};
      const idx=plan.recurringRules.findIndex(x=>x.id===rule.id);
      if(idx>=0)plan.recurringRules[idx]=rule;else plan.recurringRules.push(rule);
      saveLocal();renderRecurring();saveCloud();resetRecurringForm();
    }
    function collect(){
      plan.pinkGoal=Math.max(0,Number($("pinkGoal").value||0));
      plan.categoryBudgets={};
      $("budgetRows").querySelectorAll(".budget-row").forEach(row=>{
        const name=row.querySelector("select").value,amount=Number(row.querySelector("input").value||0);
        if(name&&amount>0)plan.categoryBudgets[name]=amount;
      });
    }
    function saveLocal(){localStorage.setItem(PLAN_KEY,JSON.stringify(plan))}
    function cloudSettings(){
      try{const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");return{apiUrl:s.apiUrl||DEFAULT_API,password:s.password||"",autoCloudSave:!!s.autoCloudSave}}
      catch(e){return{apiUrl:DEFAULT_API,password:"",autoCloudSave:false}}
    }
    async function saveCloud(){
      const s=cloudSettings();if(!s.password||!s.autoCloudSave)return;
      let entries=[];try{entries=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){}
      try{await fetch(s.apiUrl,{method:"POST",headers:{"Content-Type":"application/json","X-App-Password":s.password},
        body:JSON.stringify({key:APP_KEY,app:APP_KEY,data:{app:APP_KEY,version:APP_VERSION,entries,plan,savedAt:new Date().toISOString()}})})}catch(e){}
    }
    async function save(){
      collect();saveLocal();await saveCloud();
      $("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800);
    }
    function init(){
      load();$("pinkGoal").value=plan.pinkGoal;
      $("recCategory").innerHTML=CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");
      Object.entries(plan.categoryBudgets).forEach(([n,a])=>addBudgetRow(n,a));
      renderFunds();
      renderRecurring();resetRecurringForm();
      $("addBudget").onclick=()=>addBudgetRow("おやつ","");
      $("addFund").onclick=addFund;$("saveRecurring").onclick=saveRecurringRule;$("saveBtn").onclick=save;
    }
    window.addEventListener("DOMContentLoaded",init);
  </script>
</body>
</html>
