<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>計算アプリ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#20242a}
main{max-width:820px;margin:auto;padding:28px 18px 50px}
h1{text-align:center;margin:0 0 8px;font-size:38px}
p{text-align:center;color:#717782;margin:0 0 28px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:28px;padding:18px;box-shadow:0 10px 30px #00000012;transition:.15s}
.card:active{transform:scale(.98)}
.card img{width:100%;display:block;border-radius:22px}
.card h2{text-align:center;margin:14px 0 5px;font-size:24px}
.card div{text-align:center;color:#70757d;font-size:14px;line-height:1.5}
@media(max-width:620px){.apps{grid-template-columns:1fr}h1{font-size:32px}}
</style>
</head>
<body>
<main>
<h1>計算アプリ</h1>
<p>やりたいゲームを選んでね！</p>
<div class="apps">
<a class="card" href="./keisan-flash.html">
<img src="./keisan-flash-icon.png" alt="計算フラッシュ">
<h2>計算フラッシュ</h2>
<div>九九・足し算・引き算・逆九九<br>1〜5秒のスピード練習</div>
</a>
<a class="card" href="./5mon-challenge.html">
<img src="./5mon-challenge-icon.png" alt="5もんチャレンジ">
<h2>5もんチャレンジ</h2>
<div>5問できたらミニゲーム！<br>5問 → ゲーム → 5問 → ゲーム</div>
</a>
</div>
</main>
</body>
</html>
