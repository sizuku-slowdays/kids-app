<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fd8c7">
<title>わが家アプリ｜ママ</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./img/icon-192.png">
<link rel="stylesheet" href="./css/wagaya.css">
<script src="./js/apps.js?v=20260913-2" defer></script>

<style>
  .top-date{font-size:1.05rem;font-weight:800;margin:0 0 14px;color:#355f57}
  .home-switch{display:flex;gap:8px;margin:0 0 18px}
  .home-switch a{flex:1;text-align:center;text-decoration:none;padding:10px 12px;border-radius:14px;background:#edf4f2;color:#36544e;font-weight:800}
  .home-switch a.active{background:#8fd8c7;color:#183a33}
  .hero-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:10px 0 22px}
  .hero-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e3ece9;border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
  .hero-card .big{font-size:2rem;display:block;margin-bottom:7px}
  .hero-card strong{display:block;font-size:1.05rem;margin-bottom:4px}
  .hero-card small{color:#6d7d79;line-height:1.45}
  .important-card{display:block;text-decoration:none;color:inherit;background:#fff8da;border:1px solid #f1df8e;border-radius:20px;padding:16px;margin:0 0 22px}
  .important-card strong{font-size:1.08rem}
  .section-title{margin:18px 0 10px}
  .points-alert{display:none;width:100%;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;padding:14px 15px;border:1px solid #f0c98c;border-radius:18px;color:#6f451c;background:linear-gradient(135deg,#fff8e7,#fff1d6);box-shadow:0 6px 18px rgba(133,86,28,.08);font:inherit;text-align:left;cursor:pointer}
  .points-alert.show{display:flex}
  .points-alert-copy{display:grid;gap:2px}
  .points-alert strong{font-size:1rem}
  .points-alert small{color:#8a6744;font-weight:700}
  .points-alert-arrow{flex:0 0 auto;font-size:1.55rem;color:#b87532}
  @media(max-width:520px){.hero-grid{grid-template-columns:1fr 1fr}.hero-card{padding:14px}}
</style>

</head>
<body data-page="home" data-audience="mama">
<main class="page-shell">
  <p class="top-date" id="today">今日</p>

  <div class="home-switch" aria-label="ホーム切り替え">
    <a href="./index.html">こども</a>
    <a class="active" href="./mama.html">ママ</a>
  </div>

  <button class="points-alert" id="pointsAlert" type="button" aria-label="お手伝いポイントの交換申請を確認する">
    <span class="points-alert-copy">
      <strong id="pointsAlertText">🎁 お手伝いポイントのお知らせ</strong>
      <small>タップして承認・NGをえらぶ</small>
    </span>
    <span class="points-alert-arrow" aria-hidden="true">›</span>
  </button>

  <section class="apps-section">
    <div class="section-heading">
      <div><p class="section-kicker">管理</p><h2>よく使うアプリ</h2></div>
    </div>
    <div class="hero-grid">
      <a class="hero-card" href="https://cetus.fun/kanriapp/otetsuday-toban.html">
        <span class="big">🧹</span><strong>お手伝い当番</strong><small>当番・ポイント・ごほうびを管理</small>
      </a>
      <a class="hero-card" href="./timetable.html">
        <span class="big">🗓️</span><strong>時間割</strong><small>4年生・2年生の時間割画像を確認</small>
      </a>
      <a class="hero-card" href="https://cetus.fun/wagaya/album/">
        <span class="big">🖼️</span><strong>おうちアルバム</strong><small>何度も見る写真・動画をすぐ開く</small>
      </a>
    </div>
  </section>

  <section class="apps-section">
    <div class="section-heading">
      <div><p class="section-kicker">一覧</p><h2>アプリ</h2></div>
    </div>
    <div class="app-grid" id="featured-apps" aria-live="polite">
      <p class="loading-message">アプリを読み込んでいます…</p>
    </div>
    <a class="all-apps-link" href="./apps.html?audience=mama">
      <span>すべてのアプリを見る</span><span aria-hidden="true">›</span>
    </a>
  </section>
<section class="apps-section"><div class="section-heading"><div><p class="section-kicker">アプリ</p><h2>最新版</h2></div></div><button class="button" id="refreshApp" type="button" style="width:100%">🔄 最新版に更新</button><p id="refreshStatus" style="margin:8px 0 0;color:#637b75;font-size:13px"></p></section></main>

<nav class="bottom-nav" aria-label="メインメニュー">
  <a class="nav-item active" href="./mama.html" aria-current="page">
    <span class="nav-icon" aria-hidden="true">⌂</span><span>ホーム</span>
  </a>
  <a class="nav-item" href="https://cetus.fun/kanriapp/notification-center.html">
    <span class="nav-icon" aria-hidden="true">🔔</span><span>通知センター</span>
  </a>
  <a class="nav-item" href="./apps.html?audience=mama">
    <span class="nav-icon" aria-hidden="true">⊞</span><span>アプリ</span>
  </a>
</nav>
<script>
(() => {
  const alertButton = document.getElementById('pointsAlert');
  const alertText = document.getElementById('pointsAlertText');
  const password = localStorage.getItem('otetsuday_pw') || '';
  const destination = 'https://cetus.fun/kanriapp/otetsuday-toban.html?open=pending-rewards#rewardRequestsCard';

  alertButton.addEventListener('click', () => {
    location.href = destination;
  });

  if (!password) return;

  fetch('https://otetsudai-api.sslowdayss.workers.dev/api/rewards/pending-count', {
    headers: { 'X-App-Password': password },
    cache: 'no-store'
  })
    .then((response) => response.ok ? response.json() : Promise.reject())
    .then((data) => {
      const count = Number(data.count) || 0;
      if (count < 1) return;
      alertText.textContent = `🎁 こうかんしんせいが ${count}件 あります`;
      alertButton.classList.add('show');
    })
    .catch(() => {});
})();
</script>
<script src="./js/pwa-refresh.js?v=20260919-1"></script></body>
</html>
